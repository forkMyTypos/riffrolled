%3E%3C%2Fg%3E%3C%2Fsvg%3E">

<style>
/* ================================================================= */
/* ==  DESIGN TOKENS                                              == */
/* ================================================================= */
:root{
  --bg:#0a0a13;
  --panel:#15151f;
  --panel-2:#1c1c2b;
  --raise:rgba(255,255,255,0.05);
  --raise-2:rgba(255,255,255,0.10);
  --line:rgba(255,255,255,0.08);
  --line-2:rgba(255,255,255,0.15);
  --text:#eceaf6;
  --dim:rgba(236,234,246,0.58);
  --faint:rgba(236,234,246,0.32);
  --vio:#8a7bff;
  --vio-soft:rgba(138,123,255,0.16);
  --vio-line:rgba(138,123,255,0.42);
  --vio-text:#c8bcff;
  --cyan:#46e0ff;
  --ok:#5ab88a;  --ok-soft:rgba(90,184,138,0.14);
  --err:#e06767; --err-soft:rgba(224,103,103,0.14);
  --warn:#d8a657;
  --grad:linear-gradient(90deg,var(--vio),var(--cyan));
  --r-s:8px; --r-m:12px; --r-l:16px;
  --shadow:0 14px 44px rgba(0,0,0,0.55);
  --navh:60px;
  --npbarh:54px;
  --font:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --tap:44px;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html{ height:100%; }
body{
  font-family:var(--font);
  background:var(--bg);
  background-image:
    radial-gradient(1000px 600px at 18% 22%, rgba(138,123,255,0.10), transparent 60%),
    radial-gradient(900px 700px at 85% 80%, rgba(70,224,255,0.06), transparent 60%);
  color:var(--text);
  height:100vh;
  overflow-x:hidden; overflow-y:auto;
  position:relative;
  display:flex; flex-direction:column;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:rgba(138,123,255,0.35); }

:focus-visible{ outline:2px solid var(--vio); outline-offset:2px; border-radius:4px; }
button{ font-family:inherit; touch-action:manipulation; }

/* layout utils (kept from original markup) */
.flex{display:flex;} .flexMe{display:flex;align-items:center;justify-content:center;}
.alignMe{align-items:center;} .justMe{justify-content:center;}
.column{flex-direction:column;} .flex1{flex:1;min-height:0;}
.fs1em{font-size:1em;} .w100p{width:100%;} .w3em{width:3em;}
.marLAuto{margin-left:auto;} .pad0p5em{padding:.5em} .pad1em{padding:1em} .bgTrans{background:transparent;}

/* ================================================================= */
/* ==  DECK / TURNTABLE                                           == */
/* ================================================================= */
.deck{ display:flex; align-items:center; justify-content:center; position:relative; z-index:60; pointer-events:none; }
.deck .screen, .deck .np-area, .deck .np-area *{ pointer-events:auto; }
.plinth{
  width:36rem; height:36rem; margin:2em;
  border-radius:var(--r-l);
  background:linear-gradient(160deg,#181826 0%,#101019 55%,#0c0c15 100%);
  border:1px solid var(--line);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.turntable{ width:30rem; height:30rem; border-radius:50%; background:#0a0a0a; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; }
.platter{
  width:28rem; height:28rem; border-radius:50%;
  background:
    repeating-radial-gradient(circle at center, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px),
    radial-gradient(circle, #1c1c1c 0 18%, #0d0d0d 18% 70%, #000 70%);
  animation:spin 3.2s linear infinite; animation-play-state:paused;
}
.platter.playing{ animation-play-state:running; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* video: exactly 200x200, upright, unobscured (YouTube API requirement) */
.screen{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:200px; height:200px; border-radius:6px; overflow:hidden;
  background:#000; z-index:3;
  box-shadow:0 0 0 7px #0a0a0a, 0 10px 30px rgba(0,0,0,0.65);
}
.screen #ytFrame, .screen iframe{ width:200px; height:200px; display:block; border:0; }
.screen-ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#000; z-index:4; pointer-events:none; }

.arm{ position:absolute; top:18px; right:28px; width:80px; height:150px; transform-origin:68px 16px; transform:rotate(-30deg); transition:transform .6s ease; pointer-events:none; }
.arm.playing{ transform:rotate(-10deg); }
.arm-pivot{ position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:#333; border:1px solid #555; }
.arm-rod{ position:absolute; top:16px; right:15px; width:3px; height:120px; background:linear-gradient(to bottom,#999,#555); border-radius:2px; transform:rotate(4deg); transform-origin:top center; }
.arm-head{ position:absolute; bottom:8px; right:8px; width:14px; height:5px; background:#444; border-radius:1px; }

/* transport */
.np-area{ position:absolute; bottom:22px; left:50%; transform:translateX(-50%); width:28rem; max-width:92vw; display:flex; flex-direction:column; align-items:center; gap:9px; z-index:5; }
.np-title{ font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; }
#npTitle{ display:flex; align-items:center; justify-content:center; gap:6px; }
#npTitle .np-ico{ width:14px; height:14px; flex-shrink:0; color:var(--vio); opacity:.9; }
#npTitle .np-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.transport{ display:flex; gap:12px; align-items:center; }
.t-btn{
  background:var(--raise); border:1px solid var(--line-2); color:var(--dim);
  border-radius:50%; width:44px; height:44px; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background .15s,color .15s,transform .08s; flex-shrink:0;
}
.t-btn:hover{ background:var(--raise-2); color:#fff; }
.t-btn:active{ transform:scale(.94); }
.t-btn.play{ width:56px; height:56px; font-size:20px; background:var(--vio-soft); border-color:var(--vio-line); color:var(--vio-text); }
.t-btn.play:hover{ background:rgba(138,123,255,0.28); color:#fff; }

/* now-playing meta (shared by deck + Current Track panel) */
.np-meta{ display:flex; gap:6px; width:100%; }
.np-meta input{ flex:1; min-width:0; }
.np-react{ display:flex; gap:8px; }
.react-btn{
  display:flex; align-items:center; gap:6px; background:var(--raise); border:1px solid var(--line-2);
  color:var(--dim); border-radius:var(--r-s); padding:8px 14px; font-size:13px; cursor:pointer;
  min-height:38px; transition:all .15s;
}
.react-btn.react-like:hover, .react-btn.react-like:active{ border-color:rgba(90,184,138,0.55); color:#7fd6a6; }
.react-btn.react-dislike:hover, .react-btn.react-dislike:active{ border-color:rgba(224,103,103,0.55); color:#e08585; }
.react-btn .count{ font-variant-numeric:tabular-nums; opacity:.85; }

/* spin switch */
.spin-toggle{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); user-select:none; cursor:pointer; margin-top:6px; }
.spin-toggle input{ position:absolute; opacity:0; width:0; height:0; }
.spin-track{ position:relative; width:46px; height:24px; border-radius:999px; flex-shrink:0; background:var(--raise-2); border:1px solid var(--line-2); transition:background .2s,border-color .2s,box-shadow .2s; }
.spin-thumb{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#cfcfcf; color:#333; font-size:10px; display:flex; align-items:center; justify-content:center; transition:left .2s,background .2s; }
.spin-thumb::before{ content:'♪'; }
.spin-toggle input:checked + .spin-track{ background:linear-gradient(90deg,#6c5ce7,var(--vio)); border-color:var(--vio-line); box-shadow:0 0 10px rgba(140,123,255,0.5); }
.spin-toggle input:checked + .spin-track .spin-thumb{ left:24px; background:#fff; animation:thumbspin 2.4s linear infinite; }
.spin-toggle input:focus-visible + .spin-track{ outline:2px solid var(--vio); outline-offset:2px; }
@keyframes thumbspin{ to{ transform:rotate(360deg); } }
.spin-label{ letter-spacing:.03em; }

/* ================================================================= */
/* ==  PANELS                                                     == */
/* ================================================================= */
.panel{
  position:absolute; background:var(--panel); border-radius:var(--r-m);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:var(--shadow); border:1px solid var(--line);
  min-width:220px; min-height:120px; resize:both;
}
.panel-header{
  padding:11px 13px; background:rgba(255,255,255,0.04); cursor:move;
  font-size:13px; font-weight:600; letter-spacing:.02em; user-select:none;
  display:flex; align-items:center; gap:7px; flex-shrink:0; border-bottom:1px solid var(--line);
}
.panel-header .sub{ margin-left:auto; font-size:11px; font-weight:normal; color:var(--faint); }
.panel-close{ margin-left:auto; background:transparent; border:0; color:var(--faint); font-size:15px; line-height:1; padding:6px 8px; cursor:pointer; border-radius:6px; flex-shrink:0; }
.panel-header .sub + .panel-close{ margin-left:8px; }
.panel-close:hover{ color:#fff; background:var(--raise-2); }

.mainC{ display:flex; flex-direction:column; min-height:0; overflow-y:auto; flex:1; }
.mainC > .sec{ flex:0 0 auto; }

input[type=text], input[type=password], input[type=number], select{
  background:rgba(255,255,255,0.04); border:1px solid var(--line-2); border-radius:var(--r-s);
  color:var(--text); font-size:13px; padding:9px 11px; outline:none; font-family:inherit;
  transition:border-color .15s, background .15s;
}
input:focus, select:focus{ border-color:var(--vio-line); background:rgba(255,255,255,0.06); }
input::placeholder{ color:var(--faint); }

button{
  background:var(--raise); border:1px solid var(--line-2); border-radius:var(--r-s);
  color:var(--dim); font-size:12px; padding:8px 10px; cursor:pointer;
  transition:background .15s,color .15s; white-space:nowrap;
}
button:hover{ background:var(--raise-2); color:#fff; }
button:active{ background:var(--raise-2); }
.icon-btn{ width:34px; height:34px; padding:0; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

.scrollable{ flex:1; overflow-y:auto; min-height:0; padding:6px; -webkit-overflow-scrolling:touch; }

.scrollable, .active-pl-tracks, .lk-add-results, .mainC{ scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.18) transparent; }
.scrollable::-webkit-scrollbar, .active-pl-tracks::-webkit-scrollbar, .lk-add-results::-webkit-scrollbar, .mainC::-webkit-scrollbar{ width:6px; }
.scrollable::-webkit-scrollbar-thumb, .active-pl-tracks::-webkit-scrollbar-thumb, .lk-add-results::-webkit-scrollbar-thumb, .mainC::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.18); border-radius:4px; }
.scrollable::-webkit-scrollbar-track, .active-pl-tracks::-webkit-scrollbar-track, .lk-add-results::-webkit-scrollbar-track, .mainC::-webkit-scrollbar-track{ background:transparent; }

.status-bar{ padding:6px 4px 2px; font-size:11px; color:var(--faint); flex-shrink:0; min-height:20px; }
.status-bar.ok{ color:var(--ok); } .status-bar.err{ color:var(--err); }
.status-bar:empty{ min-height:0; padding:0; }

.empty{ text-align:center; padding:28px 14px; font-size:13px; color:var(--faint); line-height:1.6; }
.row{ display:flex; gap:7px; padding:6px 8px; align-items:center; }
.row.wrap{ flex-wrap:wrap; }
.row input[type=text]{ flex:1; min-width:0; }

.del-btn{ background:none; border:none; color:rgba(255,255,255,0.18); font-size:13px; cursor:pointer; padding:6px 8px; border-radius:6px; opacity:0; flex-shrink:0; transition:opacity .12s; min-width:30px; min-height:30px; }
.del-btn:hover{ color:var(--err) !important; background:var(--err-soft) !important; }

.sec{ padding:10px; }
.sec-head{ font-size:10px; font-weight:600; letter-spacing:.09em; color:var(--faint); padding:2px 4px 9px; text-transform:uppercase; }

.act-btn{ flex:1; padding:9px 4px; font-size:12px; min-height:var(--tap); }
.act-btn.primary{ border-color:var(--vio-line); color:var(--vio-text); background:var(--vio-soft); }
.act-btn.primary:hover{ background:rgba(140,123,255,0.26); }
.other-row{ display:none; gap:6px; padding:6px 4px 2px; align-items:center; }
.other-row.open{ display:flex; }
.other-row select{ flex:1; min-width:0; }
.other-row select option{ background:var(--panel); }

.row-item{
  display:flex; align-items:center; gap:8px; padding:9px 8px; border-radius:var(--r-s);
  cursor:pointer; font-size:13px; border:1px solid transparent; margin-bottom:2px; min-height:var(--tap);
}
.row-item:hover{ background:rgba(255,255,255,0.06); }
.row-item:hover .del-btn{ opacity:1; }
.row-item .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-item.active{ background:var(--vio-soft); border-color:rgba(140,123,255,0.35); }

/* ── Current Track panel body ── */
.ct-body{ display:flex; flex-direction:column; gap:12px; padding:13px 14px; }
.ct-body .np-title{ font-size:14px; color:var(--text); font-weight:600; white-space:normal; text-align:left; line-height:1.35; }
.ct-body .np-meta{ flex-direction:column; gap:8px; }
.ct-body .np-react{ gap:9px; }
.ct-titlebar{ display:flex; flex-direction:column; gap:4px; }
.ct-tlabel{ font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--faint); }
.ct-title-edit{ font-size:14px; font-weight:600; color:#fff; width:100%; }
.ct-autopop{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); cursor:pointer; margin-top:2px; min-height:32px; }
.ct-autopop input{ accent-color:var(--vio); width:16px; height:16px; }

/* ── About & Legal ── */
.info-tabs{ display:flex; gap:4px; padding:10px 12px 0; flex:0 0 auto; }
.info-tab{ flex:1; font-size:12px; padding:9px 4px; border-radius:8px 8px 0 0; background:transparent; border:0; color:var(--dim); cursor:pointer; }
.info-tab.active{ color:#fff; background:var(--vio-soft); }
.info-content{ padding:13px 15px; flex:1; overflow:auto; font-size:12.5px; line-height:1.55; color:var(--dim); }
.info-content h4{ color:#fff; font-size:13px; margin:2px 0 6px; }
.info-content p{ margin:0 0 9px; }
.info-content ul{ margin:0 0 9px; padding-left:18px; }
.info-content li{ margin:0 0 4px; }
.info-content a{ color:var(--vio); }
.info-meta{ font-size:10px; color:var(--faint); margin-top:4px; }

/* ── Roll the Riff ── */
.riff-brand{ display:flex; align-items:center; gap:8px; padding:10px 12px 2px; }
.riff-brand svg{ width:30px; height:30px; flex-shrink:0; }
.riff-logo .riff-die{ transform-box:fill-box; transform-origin:center; }
.riff-logo .d1{ transform:rotate(-10deg); animation:riffTumbleA 2.4s ease-in-out infinite; }
.riff-logo .d2{ transform:rotate(12deg); animation:riffTumbleB 2.8s ease-in-out infinite; }
@keyframes riffTumbleA{ 0%,100%{ transform:rotate(-10deg) translateY(0);} 30%{ transform:rotate(7deg) translateY(-1px);} 62%{ transform:rotate(-4deg) translateY(.5px);} }
@keyframes riffTumbleB{ 0%,100%{ transform:rotate(12deg) translateY(0);} 34%{ transform:rotate(-6deg) translateY(-1px);} 66%{ transform:rotate(5deg) translateY(.5px);} }
.riff-brand.rolling .d1{ animation:riffSpinDie .5s linear infinite; }
.riff-brand.rolling .d2{ animation:riffSpinDie .58s linear infinite reverse; }
@keyframes riffSpinDie{ from{ transform:rotate(0);} to{ transform:rotate(360deg);} }
.riff-wordmark{ font-weight:700; letter-spacing:1.5px; font-size:15px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.riff-body{ display:flex; flex-direction:column; align-items:center; gap:13px; padding:8px 14px 16px; }
.riff-portal{ position:relative; width:128px; height:128px; border-radius:50%; border:0; cursor:pointer; overflow:hidden;
  background:radial-gradient(circle at 50% 50%, #15152b 0 37%, transparent 38%), conic-gradient(from 0deg, #8a7bff, #46e0ff, #d56bff, #8a7bff);
  box-shadow:0 0 22px rgba(120,110,255,0.45), inset 0 0 18px rgba(0,0,0,0.6);
  display:flex; align-items:center; justify-content:center; transition:transform .15s, box-shadow .2s; }
.riff-portal:hover{ transform:scale(1.04); box-shadow:0 0 34px rgba(120,140,255,0.7), inset 0 0 18px rgba(0,0,0,0.6); }
.riff-portal:active{ transform:scale(.97); }
.riff-portal::before{ content:''; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, transparent, rgba(255,255,255,0.4), transparent 30%); animation:riffSpin 6s linear infinite; opacity:.45; }
.riff-portal .riff-label{ position:relative; z-index:2; font-weight:700; letter-spacing:2px; font-size:15px; color:#fff; text-shadow:0 1px 5px rgba(0,0,0,0.7); }
.riff-portal.rolling{ animation:riffPulse .5s ease-in-out infinite; pointer-events:none; }
.riff-portal.rolling::before{ animation:riffSpin .5s linear infinite; opacity:1; }
.riff-portal.rolling .riff-label{ opacity:.4; }
@keyframes riffSpin{ to{ transform:rotate(360deg);} }
@keyframes riffPulse{ 0%,100%{ box-shadow:0 0 22px rgba(120,110,255,0.5),inset 0 0 18px rgba(0,0,0,0.6);} 50%{ box-shadow:0 0 48px rgba(90,220,255,0.9),inset 0 0 18px rgba(0,0,0,0.6);} }
.riff-hint{ font-size:11px; color:var(--faint); text-align:center; line-height:1.4; }
.riff-result{ width:100%; border-radius:10px; padding:12px; background:rgba(255,255,255,0.04);
  border:1px solid var(--rar,#9aa0b5); box-shadow:0 0 18px -5px var(--rar,#9aa0b5);

.riff-result:empty{ display:none; }
.riff-result.show{ opacity:1; transform:none; }
.riff-rarity{ font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--rar,#9aa0b5); }
.riff-rname{ font-size:14px; font-weight:600; margin:3px 0 2px; color:#fff; word-break:break-word; }
.riff-rmeta{ font-size:11px; color:var(--dim); margin-bottom:9px; }
.riff-result .riff-play{ font-size:12px; padding:8px 14px; border-radius:8px; min-height:38px; }

.riff-target{ display:flex; flex-direction:column; gap:2px; }
.riff-target label{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dim); cursor:pointer; min-height:36px; }
.riff-target input{ accent-color:var(--vio); width:16px; height:16px; }
.riff-newname{ font-size:12px; padding:8px 9px; }
.riff-row{ display:flex; gap:8px; align-items:center; }
.riff-field{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); flex-shrink:0; }
.riff-count{ width:54px; font-size:12px; padding:8px 6px; text-align:center; }
.riff-tags{ flex:1; min-width:0; font-size:12px; padding:8px 9px; }
.riff-list{ list-style:none; margin:8px 0 0; padding:0; max-height:160px; overflow:auto; display:flex; flex-direction:column; gap:6px; }

.riff-li-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── Current Playlist ── */
.active-pl{ display:flex; flex-direction:column; flex:1; min-height:0; }
.active-pl-header{ padding:9px 13px 2px; font-size:11px; }
.pl-status{ font-weight:600; }
.active-pl-name-row{ padding:2px 13px 9px; border-bottom:1px solid var(--line); }

.active-pl-name:focus{ border-bottom:1px solid var(--vio-line) !important; }
.active-pl-sub{ display:flex; align-items:center; gap:8px; padding:8px 11px; font-size:12px; color:var(--dim); border-bottom:1px solid var(--line); }

.active-pl-msg{ padding:6px 13px 0; font-size:11px; min-height:0; color:var(--dim); transition:color .15s; }
.active-pl-msg:not(:empty){ padding-bottom:2px; }
.active-pl-filter-row{ padding:9px 10px; flex-shrink:0; border-top:1px solid var(--line); }
.active-pl-filter-row input{ width:100%; }
.active-pl-tracks{ flex:1; overflow-y:auto; min-height:0; padding:6px; -webkit-overflow-scrolling:touch; }

.track-handle{ color:rgba(255,255,255,0.22); cursor:grab; font-size:14px; flex-shrink:0; line-height:1; touch-action:none; padding:6px 2px; }
.row-item:hover .track-handle{ color:rgba(255,255,255,0.5); }

.row-item.dragging{ opacity:.35; }
.row-item.drop-into{ box-shadow:inset 0 2px 0 0 var(--vio); }
.now-dot{ color:var(--vio); flex-shrink:0; font-size:11px; }

/* ── Playlists ── */
.pl-tools{ padding:9px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); flex-shrink:0; }
.pl-create-row{ display:flex; gap:6px; align-items:center; }

.pl-create-row .createPl:hover{ background:rgba(140,123,255,0.28); }
.pl-search-input{ width:100%; }
.pl-list{ padding:6px; }
.pl-item-count{ font-size:11px; color:var(--faint); flex-shrink:0; font-variant-numeric:tabular-nums; }
.pl-footer{ display:flex; gap:6px; padding:9px; border-top:1px solid var(--line); flex-shrink:0; }
.pl-footer button{ flex:1; min-height:38px; }

/* ── library / search bits ── */
.lib-pill{ font-size:11px; flex-shrink:0; padding:3px 8px; border-radius:10px; }
.lib-pill.in{ color:rgba(90,184,138,0.9); background:var(--ok-soft); }
.lib-add-btn{ width:32px; height:32px; font-size:14px; padding:0; color:var(--vio-text); flex-shrink:0; }
.mini-transport{ margin-left:auto; display:flex; gap:5px; align-items:center; }
.mini-transport .icon-btn{ width:32px; height:32px; font-size:12px; }
.mini-transport .mini-play{ color:var(--vio-text); background:var(--vio-soft); border-color:var(--vio-line); }
.mini-transport .mini-play:hover{ background:rgba(140,123,255,0.3); }
.st-results{ padding:6px; }
.st-play{ width:32px; height:32px; font-size:12px; padding:0; flex-shrink:0; }

/* ── channel import ── */
.ch-sec{ border-top:1px solid var(--line); }
.ch-input{ flex:1; min-width:0; }
.ch-limit{ background:rgba(255,255,255,0.05); border:1px solid var(--line-2); color:var(--dim); border-radius:var(--r-s); padding:0 6px; font-size:12px; cursor:pointer; flex-shrink:0; }
.ch-go{ background:var(--vio-soft); border:1px solid var(--vio-line); color:var(--vio-text); }
.ch-go:hover{ background:rgba(140,123,255,0.28); }
.ch-keyhint{ padding:4px 4px 0; }
.ch-keytoggle{ font-size:11px; color:var(--faint); cursor:pointer; padding:6px 0; display:inline-block; }
.ch-keytoggle:hover{ color:var(--vio-text); }
.ch-keyrow{ display:none; gap:6px; padding:6px 4px 0; align-items:center; }
.ch-keyrow.open{ display:flex; }
.ch-keyrow input{ flex:1; min-width:0; }

/* ── Links ── */
.lk-body{ padding:6px; }
.lk-chevron{ color:rgba(255,255,255,0.25); flex-shrink:0; }
.lk-back{ font-size:12px; color:var(--vio-text); cursor:pointer; padding:9px 8px; display:inline-block; }
.lk-back:hover{ text-decoration:underline; }
.lk-current{ font-size:14px; font-weight:700; padding:2px 8px 8px; color:#fff; }
.lk-group{ margin:2px 0 12px; }
.lk-group-head{ font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); padding:2px 8px 5px; display:flex; align-items:center; }
.lk-count{ font-size:11px; color:var(--dim); flex-shrink:0; padding:1px 7px; background:var(--raise); border-radius:10px; }
.lk-linkbtn{ margin-left:auto; font-size:11px; padding:5px 10px; color:var(--vio-text); background:var(--vio-soft); border:1px solid var(--vio-line); border-radius:7px; }
.lk-linkbtn:hover{ background:rgba(140,123,255,0.28); }
.lk-add{ display:none; padding:4px 6px 8px; }
.lk-add.open{ display:block; }
.lk-add-search{ width:100%; }
.lk-add-results{ max-height:170px; overflow-y:auto; margin-top:6px; -webkit-overflow-scrolling:touch; }
.lk-link .name{ cursor:pointer; }
.lk-link .name:hover{ color:var(--vio-text); }

/* ================================================================= */
/* ==  DESKTOP DOCK                                               == */
/* ================================================================= */
.rightM{
  position:fixed; right:0; top:0; height:100vh; width:58px; z-index:1000;
  display:flex; flex-direction:column; gap:10px; align-items:center;
  padding:16px 0;
  background:rgba(10,10,22,0.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-left:1px solid var(--line);
}
.dock-btn{
  width:42px; height:42px; border-radius:11px; font-size:18px; padding:0;
  background:var(--raise); border:1px solid rgba(255,255,255,0.09);
  display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s;
}
.dock-btn:hover{ background:var(--raise-2); }
.dock-btn.active{ background:rgba(140,123,255,0.2); border-color:rgba(140,123,255,0.45); }
.dock-btn:not(.active){ opacity:.5; }
.dock-btn svg{ width:24px; height:24px; display:block; }

.is-hidden{ display:none !important; }

/* neon brand (desktop) */
.brand-burn{
  position:fixed; top:16px; right:74px; z-index:1; pointer-events:none; user-select:none;
  display:flex; align-items:center; gap:13px;
  color:rgba(120,200,255,0.8);
  filter:drop-shadow(0 0 6px rgba(70,224,255,0.35));
  transform:skewX(-4deg);
}
.brand-burn svg{ width:52px; height:52px; }
.bb-word{ display:flex; align-items:baseline; font-size:27px; font-weight:700; letter-spacing:2px; line-height:1; }
.bb-word em{ font-style:normal; }
.bb-riff{ color:#9d8cff; text-shadow:0 0 10px rgba(138,123,255,0.6), 0 0 26px rgba(138,123,255,0.3); }
.bb-rolled{ color:#46e0ff; text-shadow:0 0 10px rgba(70,224,255,0.55), 0 0 26px rgba(70,224,255,0.28); }
.bb-tld{ font-size:14px; font-weight:700; letter-spacing:3px; margin-left:4px; color:rgba(235,245,255,0.65); text-shadow:0 0 8px rgba(160,200,255,0.4); }
body.mobile .brand-burn{ display:none; }

/* app banner */
.app-banner{ position:fixed; top:0; left:0; right:0; z-index:3000; display:flex; gap:10px; align-items:center; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); font-size:13px; color:#fff; background:#c0392b; box-shadow:0 2px 12px rgba(0,0,0,0.4); }
.app-banner[hidden]{ display:none; }
.app-banner.warn{ background:#b9770e; }
.app-banner.ok{ background:#2f8f5b; }
.app-banner .x{ margin-left:auto; cursor:pointer; opacity:.85; font-size:15px; padding:6px; }
.app-banner .x:hover{ opacity:1; }

/* ================================================================= */
/* ==  MOBILE (app-shell: deck home + full-screen sheets + tab bar) */
/* ================================================================= */
.mnav, .np-bar, .m-head, .more-sheet{ display:none; }

body.mobile{
  height:auto; min-height:100vh; min-height:100dvh;
  overflow-y:auto;   /* the deck screen can scroll on short phones */
  padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom));
}
body.mobile.has-np{ padding-bottom:calc(var(--navh) + var(--npbarh) + 16px + env(safe-area-inset-bottom)); }
body.mobile.sheet-open{ overflow:hidden; }  /* sheets scroll internally */

/* mobile header: wordmark strip at the top of the deck screen */
body.mobile .m-head{
  display:flex; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 6px;
}
.m-head svg{ width:34px; height:34px; flex-shrink:0; }
.m-head .mh-word{ font-size:19px; font-weight:700; letter-spacing:1.5px; line-height:1; }
.m-head .mh-word em{ font-style:normal; }
.m-head .mh-riff{ color:#9d8cff; text-shadow:0 0 12px rgba(138,123,255,0.55); }
.m-head .mh-rolled{ color:#46e0ff; text-shadow:0 0 12px rgba(70,224,255,0.5); }

/* deck fills the space between header and tab bar */
body.mobile > .flex.flex1{ display:block; flex:0 0 auto; }
body.mobile #deck{
  width:100%; margin:0; padding:4px 0 0;
  min-height:calc(100dvh - var(--navh) - 120px - env(safe-area-inset-bottom));
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  overflow:visible;
}
body.mobile #deck .plinth{ width:min(88vw,370px); height:min(88vw,370px); margin:6px 0 14px; }
body.mobile #deck .turntable{ width:88%; height:88%; }
body.mobile #deck .platter{ width:82%; height:82%; }
body.mobile #deck .arm{ transform-origin:56px 14px; top:12px; right:16px; width:66px; height:120px; }
body.mobile #deck .arm-rod{ height:96px; }
/* transport sits in normal flow under the record */
body.mobile #deck .np-area{ position:static; transform:none; width:min(92vw,420px); margin:0 auto; padding:0 8px; }

/* the desktop dock is gone; bottom tab bar takes over */
body.mobile .rightM{ display:none; }

/* panels become full-screen sheets above the deck */
body.mobile .panel{
  position:fixed !important; left:0 !important; right:0 !important; top:0 !important;
  bottom:calc(var(--navh) + env(safe-area-inset-bottom)) !important;
  width:auto !important; height:auto !important; max-height:none !important;
  margin:0 !important; border-radius:0; border-left:0; border-right:0; border-bottom:0;
  resize:none !important; z-index:800 !important;
  padding-top:env(safe-area-inset-top);
  background:var(--bg);
}
body.mobile .panel.sheet-in{ animation:sheetUp .26s cubic-bezier(.32,.72,.32,1); }
@keyframes sheetUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
body.mobile .panel-header{ cursor:default; padding:14px 16px; font-size:15px; background:transparent; }
body.mobile .panel-close{ font-size:17px; padding:8px 12px; min-width:var(--tap); min-height:40px; }

/* comfortable touch targets + no iOS zoom-on-focus */
body.mobile input[type=text], body.mobile input[type=password], body.mobile input[type=number], body.mobile select{
  font-size:16px; min-height:var(--tap);
}
body.mobile button{ min-height:38px; }
body.mobile .icon-btn, body.mobile .st-play, body.mobile .lib-add-btn{ width:40px; height:40px; min-height:40px; }
body.mobile .row-item{ padding:11px 8px; }
body.mobile .del-btn{ opacity:.55; min-width:38px; min-height:38px; }
body.mobile .track-handle{ color:rgba(255,255,255,0.45); font-size:17px; padding:8px 6px; }
body.mobile .sec{ padding:12px; }
body.mobile .info-content{ font-size:14px; }
body.mobile .active-pl-name{ font-size:18px; }
body.mobile .riff-portal{ width:150px; height:150px; }

/* ── bottom tab bar ── */
body.mobile .mnav{
  display:flex; position:fixed; left:0; right:0; bottom:0; z-index:1200;
  height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(12,12,22,0.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.mnav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:transparent; border:0; border-radius:0; color:var(--faint); padding:6px 2px 4px; cursor:pointer;
}
.mnav-btn .mi{ font-size:19px; line-height:1; }
.mnav-btn .mi svg{ width:22px; height:22px; display:block; }
.mnav-btn .ml{ font-size:10px; font-weight:600; letter-spacing:.04em; }
.mnav-btn.active{ color:var(--vio-text); }
.mnav-btn.active .mi{ filter:drop-shadow(0 0 7px rgba(138,123,255,0.55)); }
.mnav-btn:active{ background:rgba(255,255,255,0.05); }

/* ── mini now-playing bar (mobile, above the tab bar) ── */
body.mobile .np-bar{
  display:none; position:fixed; left:8px; right:8px; z-index:1150;
  bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 8px);
  height:var(--npbarh); align-items:center; gap:6px; padding:0 6px 0 12px;
  background:rgba(24,24,40,0.96); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line-2); border-radius:14px;
  box-shadow:0 10px 28px rgba(0,0,0,0.5);
}
body.mobile.has-np .np-bar{ display:flex; }
/* keep sheet content clear of the mini bar */
body.mobile.has-np .panel{ bottom:calc(var(--navh) + var(--npbarh) + 16px + env(safe-area-inset-bottom)) !important; }
.np-bar .npb-disc{ width:30px; height:30px; border-radius:50%; flex-shrink:0;
  background:radial-gradient(circle,#2a2a3e 0 26%, #101018 27% 100%);
  border:1px solid var(--line-2); position:relative; }
.np-bar .npb-disc::after{ content:''; position:absolute; inset:38%; border-radius:50%; background:var(--grad); }
body.mobile.playing .npb-disc{ animation:spin 2.6s linear infinite; }
.np-bar .npb-title{ flex:1; min-width:0; font-size:13px; font-weight:500; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; background:none; border:0; padding:8px 0; }
.np-bar .npb-btn{ width:42px; height:42px; border-radius:50%; border:0; background:transparent; color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.np-bar .npb-btn:active{ background:var(--raise-2); }
.np-bar .npb-play{ background:var(--vio-soft); color:var(--vio-text); }

/* ── "More" sheet ── */
body.mobile .more-sheet{
  display:flex; align-items:flex-end; position:fixed; inset:0; z-index:1400;
  background:rgba(0,0,0,0.55); opacity:0; pointer-events:none; transition:opacity .2s;
}
body.mobile .more-sheet.open{ opacity:1; pointer-events:auto; }
.more-card{
  width:100%; background:var(--panel-2); border-radius:18px 18px 0 0; border:1px solid var(--line-2); border-bottom:0;
  padding:10px 14px calc(16px + var(--navh) + env(safe-area-inset-bottom));
  transform:translateY(30px); transition:transform .22s cubic-bezier(.32,.72,.32,1);
}
.more-sheet.open .more-card{ transform:none; }
.more-grip{ width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:2px auto 12px; }
.more-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
.more-item{
  display:flex; align-items:center; gap:11px; padding:13px 14px; min-height:52px;
  background:var(--raise); border:1px solid var(--line); border-radius:var(--r-m);
  color:var(--text); font-size:14px; font-weight:500; text-align:left;
}
.more-item .mi{ font-size:19px; }
.more-item .mi svg{ width:24px; height:24px; display:block; }
.more-item:active{ background:var(--raise-2); }
.more-close{ display:block; width:100%; margin-top:11px; padding:12px; font-size:14px; border-radius:var(--r-m); min-height:var(--tap); }

/* very small screens */
@media (max-width:360px){
  .mnav-btn .ml{ font-size:9px; }
  body.mobile #deck .plinth{ width:min(92vw,340px); height:min(92vw,340px); }
}

/* reduced motion: no spinning platter frills, no sheet slide */
@media (prefers-reduced-motion: reduce){
  .riff-logo .riff-die, .riff-portal::before, .spin-thumb, .npb-disc{ animation:none !important; }
  body.mobile .panel.sheet-in{ animation:none; }
  *{ scroll-behavior:auto !important; }
}
</style>

<!-- Dexie (IndexedDB wrapper) — pinned version + integrity hash -->
<script src="https://cdn.jsdelivr.net/npm/dexie@4.4.3/dist/dexie.min.js"
        integrity="sha384-k6tk9WcOtb4A545U/Jgfo4DoIqdwINOlzrTiSGnj9wq0LEPurSgaYGdDZokPcgLz"
        crossorigin="anonymous"></script>

<script>
/* ================================================================= */
/* ==  DB                                                         == */
/* ================================================================= */

// app-wide banner for storage failures, quota, import/export feedback
function appNotify(msg, kind){
  var b = document.getElementById('appBanner');
  if(!b) return;
  clearTimeout(b._t);
  b.className = 'app-banner' + (kind ? ' ' + kind : '');
  b.innerHTML = '';
  var s = document.createElement('span'); s.textContent = msg; b.appendChild(s);
  var x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
  x.onclick = function(){ b.hidden = true; }; b.appendChild(x);
  b.hidden = false;
  if (kind === 'ok') b._t = setTimeout(function(){ b.hidden = true; }, 4000);
}

var db = new Dexie('VinylDB11');

db.version(2).stores({
  playlists: '++id, name, createdAt, plays, tags',
  tracks: '++id, ytId, name, artist, tags, plays',
  playlistTracks: '++id, playlistId, trackId, addedAt'
});

// v3 adds an explicit `order` field on join rows so tracks can be reordered.
db.version(3).stores({
  playlists: '++id, name, createdAt, plays, tags',
  tracks: '++id, ytId, name, artist, tags, plays',
  playlistTracks: '++id, playlistId, trackId, addedAt, order'
}).upgrade(async tx => {
  const rows = await tx.table('playlistTracks').toArray();
  rows.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
  const next = {};
  for (const r of rows){
    const n = (next[r.playlistId] = (next[r.playlistId] ?? -1) + 1);
    await tx.table('playlistTracks').update(r.id, { order: n });
  }
});

// v4 adds a play-history log used by the Links panel
db.version(4).stores({
  playlists: '++id, name, createdAt, plays, tags',
  tracks: '++id, ytId, name, artist, tags, plays',
  playlistTracks: '++id, playlistId, trackId, addedAt, order',
  playHistory: '++id, trackId, ytId, ts'
});

// v5 adds explicit track <-> track links
db.version(5).stores({
  playlists: '++id, name, createdAt, plays, tags',
  tracks: '++id, ytId, name, artist, tags, plays',
  playlistTracks: '++id, playlistId, trackId, addedAt, order',
  playHistory: '++id, trackId, ytId, ts',
  trackLinks: '++id, a, b, createdAt'
});

// v6 adds a small key/value settings table (e.g. the YouTube Data API key)
db.version(6).stores({
  playlists: '++id, name, createdAt, plays, tags',
  tracks: '++id, ytId, name, artist, tags, plays',
  playlistTracks: '++id, playlistId, trackId, addedAt, order',
  playHistory: '++id, trackId, ytId, ts',
  trackLinks: '++id, a, b, createdAt',
  settings: 'k'
});

// v7 adds like/dislike reactions (a tally — you can react multiple times)
db.version(7).stores({
  playlists: '++id, name, createdAt, plays, tags',
  tracks: '++id, ytId, name, artist, tags, plays',
  playlistTracks: '++id, playlistId, trackId, addedAt, order',
  playHistory: '++id, trackId, ytId, ts',
  trackLinks: '++id, a, b, createdAt',
  settings: 'k',
  reactions: '++id, ytId, trackId, kind, ts'
});

var dbBoss = {
  createPl: async function(n){
    if(!n) n = 'Playlist';
    return await db.playlists.add({ name: n, createdAt: Date.now() });
  },

  getPlaylists: async function(){
    return await db.playlists.orderBy('createdAt').reverse().toArray();
  },

  createTrack: async function(ytId, name){
    if(!name) name = 'track';
    let existing = await db.tracks.where('ytId').equals(ytId).first();
    if(existing) return existing.id;
    return await db.tracks.add({ ytId, name, createdAt: Date.now() });
  },

  // add an existing track to a playlist (appended to the end). returns 'added' | 'dupe'
  addToPlaylist: async function(playlistId, trackId){
    const exists = await db.playlistTracks.where({ playlistId, trackId }).first();
    if(exists) return 'dupe';
    const count = await db.playlistTracks.where('playlistId').equals(playlistId).count();
    await db.playlistTracks.add({ playlistId, trackId, addedAt: Date.now(), order: count });
    return 'added';
  },

  countTracks: async function(playlistId){
    return await db.playlistTracks.where('playlistId').equals(playlistId).count();
  },

  // record a play (powers the Links panel)
  logPlay: async function(ytId){
    if(!ytId) return;
    try {
      const t = await db.tracks.where('ytId').equals(ytId).first();
      await db.playHistory.add({ trackId: t ? t.id : null, ytId: ytId, ts: Date.now() });
    } catch(e){}
  },

  // bundle everything into a portable, id-independent object
  exportData: async function(){
    const tracks = await db.tracks.toArray();
    const playlists = await db.playlists.orderBy('createdAt').toArray();
    const out = { app:'vinyl-player', version:1, exportedAt: Date.now(), library:[], playlists:[] };
    out.library = tracks.map(t => ({ ytId:t.ytId, name:t.name }));
    for (const pl of playlists){
      const joins = await db.playlistTracks.where('playlistId').equals(pl.id).sortBy('order');
      const items = [];
      for (const j of joins){
        const tr = tracks.find(t => t.id === j.trackId);
        if (tr) items.push({ ytId:tr.ytId, name:tr.name });
      }
      out.playlists.push({ name: pl.name, tracks: items });
    }
    out.links = [];
    const allLinks = await db.trackLinks.toArray();
    for (const l of allLinks){
      const ta = tracks.find(t => t.id === l.a);
      const tb = tracks.find(t => t.id === l.b);
      if (ta && tb) out.links.push({ a: ta.ytId, b: tb.ytId });
    }
    return out;
  },

  // merge an exported object into the current data — no duplicates
  importData: async function(obj){
    if(!obj || (!obj.playlists && !obj.library)) throw new Error('unrecognised file');
    let addedTracks = 0, addedPlaylists = 0, addedJoins = 0, addedLinks = 0;

    if (Array.isArray(obj.library)){
      for (const t of obj.library){
        if(!t || !t.ytId) continue;
        const before = await db.tracks.where('ytId').equals(t.ytId).first();
        await this.createTrack(t.ytId, t.name);
        if(!before) addedTracks++;
      }
    }
    if (Array.isArray(obj.playlists)){
      for (const pl of obj.playlists){
        if(!pl || !pl.name) continue;
        const existing = await db.playlists.where('name').equals(pl.name).first();
        const plId = existing ? existing.id : await this.createPl(pl.name);
        if (!existing) addedPlaylists++;
        if (Array.isArray(pl.tracks)){
          for (const t of pl.tracks){
            if(!t || !t.ytId) continue;
            const trackId = await this.createTrack(t.ytId, t.name);
            const r = await this.addToPlaylist(plId, trackId);
            if (r === 'added') addedJoins++;
          }
        }
      }
    }
    if (Array.isArray(obj.links)){
      for (const l of obj.links){
        if(!l || !l.a || !l.b) continue;
        const ta = await db.tracks.where('ytId').equals(l.a).first();
        const tb = await db.tracks.where('ytId').equals(l.b).first();
        if (ta && tb){ const r = await this.linkTracks(ta.id, tb.id); if (r === 'added') addedLinks++; }
      }
    }
    return { addedTracks, addedPlaylists, addedJoins, addedLinks };
  },

  // ── explicit track <-> track links (undirected, stored as a<b) ──
  linkTracks: async function(id1, id2){
    if(!id1 || !id2 || id1 === id2) return 'invalid';
    const a = Math.min(id1, id2), b = Math.max(id1, id2);
    const exists = await db.trackLinks.where('a').equals(a).and(r => r.b === b).first();
    if (exists) return 'dupe';
    await db.trackLinks.add({ a, b, createdAt: Date.now() });
    return 'added';
  },

  unlinkTracks: async function(id1, id2){
    const a = Math.min(id1, id2), b = Math.max(id1, id2);
    const ex = await db.trackLinks.where('a').equals(a).and(r => r.b === b).first();
    if (ex) await db.trackLinks.delete(ex.id);
  },

  getLinkedTrackIds: async function(trackId){
    const asA = await db.trackLinks.where('a').equals(trackId).toArray();
    const asB = await db.trackLinks.where('b').equals(trackId).toArray();
    const ids = new Set();
    asA.forEach(r => ids.add(r.b));
    asB.forEach(r => ids.add(r.a));
    return [...ids];
  },

  getSetting: async function(k){ const r = await db.settings.get(k); return r ? r.v : null; },
  setSetting: async function(k, v){ await db.settings.put({ k:k, v:v }); },

  getTrack: async function(ytId){ return await db.tracks.where('ytId').equals(ytId).first(); },
  updateTrackMeta: async function(ytId, fields){
    const t = await db.tracks.where('ytId').equals(ytId).first();
    if (t) await db.tracks.update(t.id, fields);
  },
  addReaction: async function(ytId, kind){
    if(!ytId) return;
    const t = await db.tracks.where('ytId').equals(ytId).first();
    await db.reactions.add({ ytId:ytId, trackId: t ? t.id : null, kind:kind, ts: Date.now() });
  },
  getReactions: async function(ytId){
    const rows = await db.reactions.where('ytId').equals(ytId).toArray();
    let like = 0, dislike = 0;
    rows.forEach(r => { if (r.kind === 'like') like++; else if (r.kind === 'dislike') dislike++; });
    return { like:like, dislike:dislike };
  }
};

// surface storage failures instead of dying silently
db.open().catch(function(err){
  appNotify('Local storage couldn’t be opened, so your library can’t be saved or loaded. If you’re in private/incognito mode, try a normal window.', 'warn');
  console.error('Dexie open failed:', err);
});

window.addEventListener('unhandledrejection', function(e){
  var r = e && e.reason;
  var name = (r && (r.name || (r.constructor && r.constructor.name))) || '';
  var text = String((r && r.message) || r || '');
  if (/quota/i.test(name) || /quota/i.test(text)){
    appNotify('Storage is full — recent changes may not have saved. Export your data, then free up space.', 'warn');
  } else if (/database|dexie|indexeddb|transaction/i.test(name) || /indexeddb/i.test(text)){
    appNotify('A storage error occurred — a recent change may not have been saved.', 'warn');
  }
});
</script>

<script>
/* ================================================================= */
/* ==  MENUS                                                      == */
/* ================================================================= */

// safe-render helper — titles can contain quotes, <, &
function escapeHtml(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

var menuB = {
    createMenu:function(title,main){
        let txt=this.createMenuD(title,main);
        document.body.insertAdjacentHTML("beforeend",txt);
        const panel=document.body.lastElementChild;
        makeDraggableEle(panel,panel.querySelector(".panel-header"));
        return panel;
    },

    createMenuD:function(title,main){
        return "<div class='cont flex column panel'>"
            +"<div class='flex alignMe title panel-header fs1em'>"+title+"<button class='panel-close' title='Close' aria-label='Close'>✕</button></div>"
            +"<div class='mainC flex1'>"+main+"</div>"
        +"</div>"
    },

    // set a sensible default position / size so panels don't all stack
    place:function(panel, css){ Object.assign(panel.style, css); return panel; },

    createTracks:function(){

        var title = `🎵 Tracks`;

        var main = `
        <div class="sec">
            <div class="sec-head">Add a track from YouTube</div>
            <div class="row">
                <input type="text" class="url-input" placeholder="YouTube URL or video ID…" inputmode="url" autocapitalize="off" autocorrect="off">
                <button class="icon-btn btn-clear-url" title="Clear">✕</button>
            </div>
            <div class="row wrap">
                <button class="act-btn primary btn-play-now">▶ Play now</button>
                <button class="act-btn btn-add-to-pl">＋ Add to playlist</button>
            </div>
            <div class="other-row">
                <select class="other-sel"></select>
                <button class="icon-btn btn-confirm-other" title="Confirm">✓</button>
            </div>
            <div class="status-bar track-status"></div>
        </div>

        <div class="sec ch-sec">
            <div class="sec-head">Import a whole channel</div>
            <div class="row">
                <input type="text" class="ch-input" placeholder="Channel URL, @handle, or ID…" inputmode="url" autocapitalize="off" autocorrect="off">
                <select class="ch-limit" title="How many to import">
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="0">All</option>
                </select>
                <button class="icon-btn ch-go" title="Import channel">↓</button>
            </div>
            <div class="ch-keyhint"><span class="ch-keytoggle">⚙ API key</span></div>
            <div class="ch-keyrow">
                <input type="password" class="ch-key" placeholder="YouTube Data API key (stored locally)">
                <button class="icon-btn ch-key-save" title="Save key">✓</button>
            </div>
            <div class="status-bar ch-status"></div>
        </div>
        `;

        const panel = this.createMenu(title, main);
        this.place(panel, { right:'150px', top:'48px', width:'300px' });
        this.tracksPanel = panel;
        this.setupTrackEvents(panel);
    },

    setupTrackEvents:function(panel){

        const input = panel.querySelector(".url-input");
        const clearBtn = panel.querySelector(".btn-clear-url");
        const playBtn = panel.querySelector(".btn-play-now");
        const addBtn = panel.querySelector(".btn-add-to-pl");
        const confirmBtn = panel.querySelector(".btn-confirm-other");
        const otherSel = panel.querySelector(".other-sel");
        const otherRow = panel.querySelector(".other-row");
        const statusEl = panel.querySelector(".track-status");

        let statusT;
        function status(msg, kind){
            statusEl.textContent = msg || '';
            statusEl.className = 'status-bar track-status' + (kind ? ' ' + kind : '');
            if(msg){
                clearTimeout(statusT);
                statusT = setTimeout(()=>{ if(statusEl.textContent === msg) status(''); }, 5000);
            }
        }

        async function resolve(){
            var ytId = getYtId(input.value);
            if(!ytId){ status('Invalid URL or video ID', 'err'); return null; }
            status('Loading…');
            var name = await fetchTitle(ytId);
            return { ytId, name };
        }

        clearBtn.onclick = () => { input.value=''; status(''); input.focus(); };

        // ▶ play now (also files the track into your library + active playlist)
        playBtn.onclick = async () => {
            var t = await resolve();
            if(!t) return;

            ytPlay(t.ytId, t.name);
            status('▶ Now playing: ' + t.name, 'ok');

            var trackId = await dbBoss.createTrack(t.ytId, t.name);
            if (window.plBoss && plBoss.activeId){
                await dbBoss.addToPlaylist(plBoss.activeId, trackId);
                plBoss.afterDbChange();
            }
        };

        // ＋ add to a chosen playlist
        addBtn.onclick = async () => {
            otherRow.classList.toggle('open');
            const pls = await dbBoss.getPlaylists();
            otherSel.innerHTML = pls
                .map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`)
                .join('');
            if (window.plBoss && plBoss.activeId) otherSel.value = plBoss.activeId;
        };

        confirmBtn.onclick = async () => {
            var t = await resolve();
            if(!t) return;

            var trackId = await dbBoss.createTrack(t.ytId, t.name);
            const plId = parseInt(otherSel.value);
            const r = await dbBoss.addToPlaylist(plId, trackId);

            status(r === 'dupe' ? 'Already in that playlist' : 'Added ✓ ' + t.name,
                   r === 'dupe' ? null : 'ok');

            otherRow.classList.remove('open');
            if (window.plBoss) plBoss.afterDbChange();
        };

        // ── channel import (YouTube Data API, user-supplied key) ──
        const chInput   = panel.querySelector('.ch-input');
        const chGo      = panel.querySelector('.ch-go');
        const chKeyRow  = panel.querySelector('.ch-keyrow');
        const chKey     = panel.querySelector('.ch-key');
        const chKeySave = panel.querySelector('.ch-key-save');
        const chToggle  = panel.querySelector('.ch-keytoggle');
        const chStatusEl = panel.querySelector('.ch-status');
        let chT;
        function chStatus(msg, kind){
            chStatusEl.textContent = msg || '';
            chStatusEl.className = 'status-bar ch-status' + (kind ? ' ' + kind : '');
            if (msg && kind === 'ok'){ clearTimeout(chT); chT = setTimeout(()=>{ if(chStatusEl.textContent===msg) chStatus(''); }, 6000); }
        }

        // prefill saved key
        dbBoss.getSetting('ytApiKey').then(k => { if (k) chKey.value = k; });
        chToggle.onclick = () => chKeyRow.classList.toggle('open');
        chKeySave.onclick = async () => {
            await dbBoss.setSetting('ytApiKey', chKey.value.trim());
            chStatus('API key saved', 'ok');
            chKeyRow.classList.remove('open');
        };

        async function ytApi(endpoint, params, key){
            const u = new URL('https://www.googleapis.com/youtube/v3/' + endpoint);
            Object.keys(params).forEach(k => u.searchParams.set(k, params[k]));
            u.searchParams.set('key', key);
            const r = await fetch(u);
            const d = await r.json();
            if (!r.ok) throw new Error((d.error && d.error.message) || ('HTTP ' + r.status));
            return d;
        }

        async function resolveChannelId(raw, key){
            raw = raw.trim();
            let m;
            if (m = raw.match(/channel\/(UC[\w-]+)/)) return m[1];
            if (/^UC[\w-]{20,}$/.test(raw)) return raw;
            let handle = null, user = null;
            if (m = raw.match(/\/@([\w.-]+)/)) handle = m[1];
            else if (raw.startsWith('@')) handle = raw.slice(1);
            else if (m = raw.match(/\/user\/([\w-]+)/)) user = m[1];
            if (handle){
                const d = await ytApi('channels', { part:'id', forHandle:'@'+handle }, key);
                if (d.items && d.items[0]) return d.items[0].id;
            }
            if (user){
                const d = await ytApi('channels', { part:'id', forUsername:user }, key);
                if (d.items && d.items[0]) return d.items[0].id;
            }
            const s = await ytApi('search', { part:'snippet', type:'channel', q: handle || user || raw, maxResults:1 }, key);
            if (s.items && s.items[0]) return s.items[0].id.channelId;
            return null;
        }

        async function importChannel(raw){
            if (!raw.trim()){ chStatus('Enter a channel URL, @handle or ID', 'err'); return; }
            const key = (await dbBoss.getSetting('ytApiKey')) || '';
            if (!key){ chStatus('Add a YouTube Data API key first (⚙ API key)', 'err'); chKeyRow.classList.add('open'); return; }
            try {
                chStatus('Finding channel…');
                const channelId = await resolveChannelId(raw, key);
                if (!channelId){ chStatus('Couldn’t find that channel', 'err'); return; }

                const ch = await ytApi('channels', { part:'contentDetails,snippet', id:channelId }, key);
                const item = ch.items && ch.items[0];
                if (!item){ chStatus('Channel not found', 'err'); return; }
                const uploads = item.contentDetails.relatedPlaylists.uploads;
                const chTitle = (item.snippet && item.snippet.title) || 'Channel';

                const existing = await db.playlists.where('name').equals(chTitle).first();
                const plId = existing ? existing.id : await dbBoss.createPl(chTitle);

                const chLimitEl = panel.querySelector('.ch-limit');
                const limit = chLimitEl ? (parseInt(chLimitEl.value, 10) || 0) : 50;  // 0 = all
                // even "All" gets a hard ceiling so a runaway channel can't burn your API quota
                const HARD_CAP = 2000, HARD_PAGES = 40;
                const MAX       = limit ? limit : HARD_CAP;
                const MAX_PAGES = limit ? Math.min(HARD_PAGES, Math.ceil(limit / 50) + 1) : HARD_PAGES;

                let pageToken = '', added = 0, seen = 0, pages = 0, stop = false;
                do {
                    const d = await ytApi('playlistItems',
                        { part:'snippet', playlistId:uploads, maxResults:50, pageToken }, key);
                    for (const it of (d.items || [])){
                        if (seen >= MAX){ stop = true; break; }
                        const sn = it.snippet || {};
                        const vid = sn.resourceId && sn.resourceId.videoId;
                        const ttl = sn.title;
                        if (!vid || ttl === 'Private video' || ttl === 'Deleted video') continue;
                        const tid = await dbBoss.createTrack(vid, ttl);
                        if ((await dbBoss.addToPlaylist(plId, tid)) === 'added') added++;
                        seen++;
                    }
                    pageToken = d.nextPageToken || '';
                    pages++;
                    chStatus('Importing… ' + added + ' added');
                } while (!stop && pageToken && seen < MAX && pages < MAX_PAGES);

                const capped = (limit && seen >= limit) ? '' : (pages >= HARD_PAGES ? ' (stopped at safety cap)' : '');
                chStatus('Added ' + added + ' videos to “' + chTitle + '”' + capped, 'ok');
                chInput.value = '';
                if (window.plBoss){ plBoss.renderPlaylists(); plBoss.renderTracks(); }
                if (window.searchBoss) searchBoss.render();
            } catch (e){
                chStatus('Import failed: ' + (e.message || e), 'err');
            }
        }

        chGo.onclick = () => importChannel(chInput.value);
        chInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') importChannel(chInput.value); });
    }
}


let z=10;
// panels stay below the deck (z-index:60) so the record player is never covered by a menu
function bringToFront(el){ el.style.zIndex = Math.min(++z, 50); }

function makeDraggableEle(panel,handle){
  let d=false,ox=0,oy=0;
  handle.onmousedown=e=>{
    if(window.dock && dock.mobile) return;                 // sheets don't drag
    if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;
    bringToFront(panel); d=true;
    const r=panel.getBoundingClientRect();
    // work in page coordinates so a panel can be dragged down into the scrollable area
    ox=e.pageX-(r.left+window.scrollX);
    oy=e.pageY-(r.top+window.scrollY);
    document.onmousemove=ev=>{
      if(!d)return;
      panel.style.left=Math.max(0, ev.pageX-ox)+'px';
      panel.style.top=Math.max(0, ev.pageY-oy)+'px';
      panel.style.right='auto';
    };
    document.onmouseup=()=>{ if(d){ d=false; if(window.dock){ if(dock.markPlaced) dock.markPlaced(panel); if(dock.saveLayoutSoon) dock.saveLayoutSoon(); } } };
  };
}


menuB.createTracks()

<script>
/* ================================================================= */
/* ==  PLAYER                                                     == */
/* ================================================================= */

function getYtId(raw) {
  raw = (raw || '').trim();
  var m = raw.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{11}$/.test(raw)) return raw;
  return null;
}

async function fetchTitle(ytId) {
  try {
    var r = await fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + ytId + '&format=json');
    if (!r.ok) return ytId;
    var d = await r.json();
    return d.title || ytId;
  } catch (e) { return ytId; }
}

async function fetchJson(ytId) {
  try {
    var r = await fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + ytId + '&format=json');
    if (!r.ok) return ytId;
    return await r.json();
  } catch (e) { return ytId; }
}


/* ── mobile mini now-playing bar ── */
var npBar = {
  el: document.getElementById('npBar'),
  title: document.getElementById('npbTitle'),
  play: document.getElementById('npbPlay'),
  next: document.getElementById('npbNext'),
  init: function(){
    var self = this;
    if (!this.el) return;
    this.play.onclick = function(e){ e.stopPropagation(); if (window.player) player.el.play.onclick(); };
    this.next.onclick = function(e){ e.stopPropagation(); if (window.plBoss) plBoss.next(); };
    this.title.onclick = function(){ if (window.dock) dock.closeSheets(); };
  },
  update: function(){
    if (!this.el || !window.player) return;
    var has = !!player.currentYtId;
    document.body.classList.toggle('has-np', has);
    document.body.classList.toggle('playing', has && player.isPlaying);
    if (has){
      this.title.textContent = player.el.title.textContent;
      this.play.textContent = player.isPlaying ? '⏸' : '▶';
    }
  }
};
npBar.init();


/* ── PLAYER / TRANSPORT CONTROLLER ── */
var player = {

  isPlaying: false,
  currentYtId: null,
  spinEnabled: true,

  yt: null,          // YT.Player instance
  ready: false,      // API + player ready
  pending: null,     // a track requested before the player was ready

  el: {
    platter: document.getElementById('platter'),
    arm:     document.getElementById('arm'),
    screenPh: document.getElementById('screenPh'),
    title:   document.querySelector('#npTitle .np-text'),
    panelTitle: document.querySelector('.ct-title'),
    play:    document.getElementById('btnPlay'),
    prev:    document.getElementById('btnPrev'),
    next:    document.getElementById('btnNext'),
    artist:       document.querySelector('.np-artist'),
    tags:         document.querySelector('.np-tags'),
    likeCount:    document.querySelector('.like-count'),
    dislikeCount: document.querySelector('.dislike-count')
  },

  // called once the IFrame API has loaded
  initApi: function () {
    var self = this;
    this.yt = new YT.Player('ytFrame', {
      width: 200, height: 200,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: function () {
          self.ready = true;
          if (self.pending) { var p = self.pending; self.pending = null; self.load(p.id, p.title); }
        },
        onStateChange: function (e) { self.onState(e); },
        onError: function (e) { self.onError(e); }
      }
    });
  },

  // unplayable video: tell the user and skip ahead (but stop if the whole queue keeps failing)
  onError: function (e) {
    var code = e && e.data, msg;
    if (code === 100)               msg = 'That video was removed or is private — skipping.';
    else if (code === 101 || code === 150) msg = 'The owner doesn’t allow this one to play in embeds — skipping.';
    else if (code === 2)            msg = 'That video link looks invalid — skipping.';
    else                            msg = 'This video couldn’t be played — skipping.';
    if (window.appNotify) appNotify(msg, 'warn');

    var qlen = (window.plBoss && plBoss.queue) ? plBoss.queue.length : 0;
    this._errStreak = (this._errStreak || 0) + 1;
    var cap = Math.min(qlen || 1, 10);
    if (qlen > 1 && this._errStreak < cap) {
      if (window.plBoss && plBoss.next) plBoss.next();
    } else if (this._errStreak >= cap) {
      if (window.appNotify) appNotify('Several videos in a row couldn’t be played — stopping.', 'warn');
      this._errStreak = 0;
    }
  },

  onState: function (e) {
    if (typeof YT === 'undefined') return;
    if (e.data === YT.PlayerState.ENDED)  { if (window.plBoss && plBoss.next) plBoss.next(); }
    else if (e.data === YT.PlayerState.PLAYING) { this._errStreak = 0; this.setPlaying(true); }
    else if (e.data === YT.PlayerState.PAUSED)  { this.setPlaying(false); }
  },

  load: function (ytId, title) {
    this.currentYtId = ytId;
    if (this.el.screenPh) this.el.screenPh.style.display = 'none';
    this.el.title.textContent = title || ytId;
    if (this.el.panelTitle) this.el.panelTitle.value = title || ytId;
    // pop the Current Track panel on a track change (desktop only — on mobile it would cover the app)
    if (window._ctAutoOpen && window.dock && !dock.mobile) {
      var ct = document.getElementById('ctPanel');
      if (ct) dock.openPanel(ct);
    }
    if (this.ready && this.yt && this.yt.loadVideoById) {
      this.yt.loadVideoById(ytId);
    } else {
      this.pending = { id: ytId, title: title };  // play as soon as the player is ready
    }
    this.setPlaying(true);
    if (window.dbBoss) { dbBoss.logPlay(ytId); this.refreshMeta(ytId, title || ytId); }
  },

  // ensure a track row exists, then populate artist/tags inputs + reaction counts
  refreshMeta: async function (ytId, title) {
    if (!window.dbBoss) return;
    try {
      await dbBoss.createTrack(ytId, title);
      const t  = await dbBoss.getTrack(ytId);
      const rc = await dbBoss.getReactions(ytId);
      if (this.currentYtId !== ytId) return;  // a newer track loaded while we awaited
      if (this.el.artist)       this.el.artist.value = (t && t.artist) || '';
      if (this.el.tags)         this.el.tags.value   = (t && t.tags)   || '';
      if (this.el.likeCount)    this.el.likeCount.textContent    = rc.like;
      if (this.el.dislikeCount) this.el.dislikeCount.textContent = rc.dislike;
    } catch (e) { /* meta is best-effort */ }
  },

  toggle: function () {
    if (!this.currentYtId) return;
    if (this.isPlaying) this.pause(); else this.resume();
  },

  pause:  function () { if (this.yt && this.yt.pauseVideo) this.yt.pauseVideo(); this.setPlaying(false); },
  resume: function () { if (this.yt && this.yt.playVideo)  this.yt.playVideo();  this.setPlaying(true);  },

  setPlaying: function (on) {
    this.isPlaying = on;
    this.el.platter.classList.toggle('playing', on && this.spinEnabled);
    this.el.arm.classList.toggle('playing', on);
    this.el.play.textContent = on ? '⏸' : '▶';
    if (window.plBoss && plBoss.updateStatus) plBoss.updateStatus();
    if (window.npBar) npBar.update();
  }
};

function ytPlay(id, title) { player.load(id, title); }

// the IFrame API calls this global when it finishes loading
function onYouTubeIframeAPIReady() { player.initApi(); }

// load the IFrame API (reliable onStateChange / auto-advance, unlike raw postMessage)
(function(){
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();

// spin on/off switch
(function(){
  var t = document.getElementById('spinToggle');
  if (!t) return;
  t.addEventListener('change', function(){
    player.spinEnabled = t.checked;
    player.el.platter.classList.toggle('playing', player.isPlaying && player.spinEnabled);
  });
})();

// now-playing meta: save artist/tags edits; like/dislike tally (can react repeatedly)
(function(){
  var artist  = document.querySelector('.np-artist');
  var tags    = document.querySelector('.np-tags');
  var like    = document.querySelector('.react-like');
  var dislike = document.querySelector('.react-dislike');

  if (artist) artist.addEventListener('change', function(){
    if (player.currentYtId && window.dbBoss) dbBoss.updateTrackMeta(player.currentYtId, { artist: artist.value.trim() });
  });
  if (tags) tags.addEventListener('change', function(){
    if (player.currentYtId && window.dbBoss) dbBoss.updateTrackMeta(player.currentYtId, { tags: tags.value.trim() });
  });

  function react(kind){
    return async function(){
      if (!player.currentYtId || !window.dbBoss) return;
      await dbBoss.addReaction(player.currentYtId, kind);
      player.refreshMeta(player.currentYtId, player.el.title ? player.el.title.textContent : player.currentYtId);
    };
  }
  if (like)    like.onclick    = react('like');
  if (dislike) dislike.onclick = react('dislike');

  // edit the current track's title from the Current Track panel
  var titleEdit = document.querySelector('.ct-title');
  if (titleEdit) titleEdit.addEventListener('change', async function(){
    if (!player.currentYtId || !window.dbBoss) return;
    var name = titleEdit.value.trim();
    if (!name) return;
    await dbBoss.updateTrackMeta(player.currentYtId, { name: name });
    if (player.el.title) player.el.title.textContent = name;          // deck title
    if (window.npBar) npBar.update();
    if (window.plBoss) { await plBoss.renderTracks(); plBoss.renderPlaylists(); }
    if (window.searchBoss) searchBoss.render();
  });

  // "pop up on track change" toggle (persisted; on by default; desktop behaviour only)
  window._ctAutoOpen = true;
  var autopop = document.querySelector('.ct-autopop-cb');
  if (autopop && window.dbBoss) {
    dbBoss.getSetting('ctAutoOpen').then(function(v){
      var on = (v === null || v === undefined) ? true : !!v;
      autopop.checked = on;
      window._ctAutoOpen = on;
    });
    autopop.addEventListener('change', function(){
      window._ctAutoOpen = autopop.checked;
      dbBoss.setSetting('ctAutoOpen', autopop.checked);
    });
  }
})();
</script>

<script>
/* ================================================================= */
/* ==  PLAYLIST / SEARCH / LINKS / RIFF / INFO                    == */
/* ================================================================= */

var plBoss = {

  queue: [],
  currentIndex: -1,

  async setup(){
    this.currentM();        // build current panel first (createM renders into it)
    this.createM();         // build playlists panel + render list
    this.bindTransport();
    this.bindKeys();
    this.updateStatus();
  },

  /* ── TRANSPORT + KEYS ── */
  bindTransport(){
    player.el.play.onclick = () => {
      if (!player.currentYtId && this.queue.length) this.playIndex(0);
      else player.toggle();
    };
    player.el.prev.onclick = () => this.prev();
    player.el.next.onclick = () => this.next();
  },

  bindKeys(){
    document.addEventListener('keydown', (e)=>{
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      if (e.code === 'Space'){ e.preventDefault(); player.el.play.onclick(); }
      else if (e.code === 'ArrowRight'){ this.next(); }
      else if (e.code === 'ArrowLeft'){ this.prev(); }
    });
  },

  playIndex(i){
    if (i < 0 || i >= this.queue.length) return;
    this.currentIndex = i;
    const t = this.queue[i];
    player.load(t.ytId, t.name);
    this.syncHighlight();
  },

  next(){ if (this.queue.length) this.playIndex((this.currentIndex + 1) % this.queue.length); },
  prev(){ if (this.queue.length) this.playIndex((this.currentIndex - 1 + this.queue.length) % this.queue.length); },

  syncHighlight(){
    const c = this.currentEl.querySelector('.active-pl-tracks');
    if (!c) return;
    c.querySelectorAll('.track-item').forEach(el=>{
      el.classList.toggle('active', Number(el.dataset.i) === this.currentIndex);
    });
  },

  updateStatus(){
    if (!this.currentEl) return;
    const mini = this.currentEl.querySelector('.mini-play');
    if (mini) mini.textContent = player.isPlaying ? '⏸' : '▶';
    const el = this.currentEl.querySelector('.pl-status');
    if (!el) return;
    if (!player.currentYtId){
      el.textContent = '■ Stopped'; el.style.color = 'rgba(255,255,255,0.4)'; return;
    }
    const inThis = this.queue.some(t => t.ytId === player.currentYtId);
    if (player.isPlaying){
      el.textContent = inThis ? '▶ Playing' : '▶ Playing (another playlist)';
      el.style.color = '#5ab88a';
    } else {
      el.textContent = '❚❚ Paused'; el.style.color = '#d8a657';
    }
  },

  msg(text, kind){
    const m = this.currentEl && this.currentEl.querySelector('.active-pl-msg');
    if (!m) return;
    m.textContent = text || '';
    m.style.color = kind === 'err' ? '#d46060' : kind === 'ok' ? '#5ab88a' : 'rgba(255,255,255,0.45)';
    if (text){ clearTimeout(this._msgT); this._msgT = setTimeout(()=>{ if (m.textContent === text) m.textContent=''; }, 4000); }
  },

  // re-render everything that can change after a DB write
  afterDbChange(){
    this.renderTracks();
    this.renderPlaylists();
    if (window.searchBoss) searchBoss.render();
  },

  /* ── PLAYLISTS PANEL ── */
  async createM(){
    var title = `📁 Playlists`;
    var main = `
      <div class="pl-tools">
        <div class="pl-create-row">
          <input type="text" class="pl-create-input" placeholder="New playlist name…">
          <button class="icon-btn createPl" title="Create playlist">＋</button>
        </div>
        <input type="text" class="pl-search-input" placeholder="🔍 Search playlists…">
      </div>
      <div class="scrollable pl-list"></div>
      <div class="pl-footer">
        <button class="btn-export" title="Download all data as JSON">⬇ Export</button>
        <button class="btn-import" title="Merge data from a JSON file">⬆ Import</button>
        <button class="btn-resetlayout" title="Restore default panel positions">↺ Layout</button>
        <input type="file" class="file-import" accept="application/json,.json" hidden>
      </div>
    `;
    this.el = menuB.createMenu(title, main);
    menuB.place(this.el, { right:'470px', top:'48px', width:'250px', height:'330px' });

    this.bindCreateEvents();
    this.renderPlaylists();
  },

  bindCreateEvents(){
    const createBtn = this.el.querySelector('.createPl');
    const createInput = this.el.querySelector('.pl-create-input');
    const searchInput = this.el.querySelector('.pl-search-input');

    const create = async () => {
      const name = createInput.value.trim();
      if(!name) return;
      await dbBoss.createPl(name);
      createInput.value = '';
      this.renderPlaylists();
    };

    createBtn.onclick = create;
    createInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') create(); });

    // separate search box — filters the list only
    searchInput.addEventListener('input', () => this.applyPlSearch());

    // ── import / export ──
    const exportBtn = this.el.querySelector('.btn-export');
    const importBtn = this.el.querySelector('.btn-import');
    const fileInput = this.el.querySelector('.file-import');

    exportBtn.onclick = async () => {
      try {
        const data = await dbBoss.exportData();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'riffrolled-export.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
      } catch(e){
        appNotify('Export failed: ' + (e.message || e), 'warn');
      }
    };

    importBtn.onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if(!file) return;
      try {
        const obj = JSON.parse(await file.text());
        const r = await dbBoss.importData(obj);
        await this.renderPlaylists();
        this.renderTracks();
        if (window.searchBoss) searchBoss.render();
        if (window.linksBoss) linksBoss.render();
        appNotify(`Imported +${r.addedPlaylists} playlists, +${r.addedTracks} tracks, +${r.addedJoins} entries, +${r.addedLinks} links`, 'ok');
      } catch(e){
        appNotify('Import failed: ' + (e.message || e), 'warn');
      }
      fileInput.value = '';
    };

    const resetBtn = this.el.querySelector('.btn-resetlayout');
    if (resetBtn) resetBtn.onclick = async () => {
      try {
        await db.settings.delete('panelLayout');
        await db.settings.delete('placedPanels');
        if (window.dock){ dock._data = null; dock._placed = new Set(); dock._ready = false; }
        appNotify('Layout reset — reloading…', 'ok');
        setTimeout(() => location.reload(), 450);   // defaults re-apply cleanly on load
      } catch(e){
        appNotify('Reset failed: ' + (e.message || e), 'warn');
      }
    };
  },

  applyPlSearch(){
    if (!this.el) return;
    const q = (this.el.querySelector('.pl-search-input').value || '').trim().toLowerCase();
    this.el.querySelectorAll('.pl-item').forEach(el=>{
      const name = el.querySelector('.pl-item-name').textContent.toLowerCase();
      el.style.display = name.includes(q) ? '' : 'none';
    });
  },

  async renderPlaylists(){
    const list = this.el.querySelector('.pl-list');
    const pls = await dbBoss.getPlaylists();

    if(!pls.length){
      list.innerHTML = `<div class="empty">No playlists yet.<br>Name one above and hit ＋</div>`;
      return;
    }

    const counts = {};
    await Promise.all(pls.map(async pl=>{ counts[pl.id] = await dbBoss.countTracks(pl.id); }));

    list.innerHTML = pls.map(pl => `
      <div class="row-item pl-item" data-id="${pl.id}">
        <span class="name pl-item-name">${escapeHtml(pl.name)}</span>
        <span class="pl-item-count">${counts[pl.id]}</span>
        <button class="del-btn" data-id="${pl.id}" title="Delete playlist">✕</button>
      </div>
    `).join('');

    list.querySelectorAll('.pl-item').forEach(el=>{
      el.onclick = (e) => {
        if (e.target.classList.contains('del-btn')) return;
        this.setActivePlaylist(Number(el.dataset.id));
        // on mobile, picking a playlist takes you straight to its tracks
        if (window.dock && dock.mobile && this.currentEl) dock.openPanel(this.currentEl);
      };
    });
    list.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick = async (e)=>{ e.stopPropagation(); await this.deletePlaylist(Number(btn.dataset.id)); };
    });

    if (!this.activeId){
      this.setActivePlaylist(pls[0].id);
    } else {
      list.querySelectorAll('.pl-item').forEach(el=>{
        el.classList.toggle('active', Number(el.dataset.id) === this.activeId);
      });
    }
    this.applyPlSearch();
  },

  async deletePlaylist(id){
    const pl = await db.playlists.get(id);
    const n = await dbBoss.countTracks(id);
    if (!confirm('Delete “' + ((pl && pl.name) || 'playlist') + '” (' + n + ' tracks)? Tracks stay in your library.')) return;

    await db.playlists.delete(id);
    const joins = await db.playlistTracks.where('playlistId').equals(id).toArray();
    await db.playlistTracks.bulkDelete(joins.map(j => j.id));
    if (this.activeId === id) this.activeId = null;

    await this.renderPlaylists();

    if (!this.activeId){
      const remaining = await dbBoss.getPlaylists();
      if (!remaining.length){
        this.currentEl.querySelector('.active-pl-name').value = 'No playlist';
        this.currentEl.querySelector('.active-pl-tracks').innerHTML = `<div class="empty">No playlist selected</div>`;
        this.currentEl.querySelector('.count').textContent = '0';
        this.queue = []; this.currentIndex = -1; this.updateStatus();
      }
    }
  },

  /* ── CURRENT PLAYLIST PANEL ── */
  currentM(){
    var title = `🎧 Current Playlist`;
    var main = `
      <div class="active-pl">

        <div class="active-pl-header">
          <span class="pl-status">■ Stopped</span>
        </div>

        <div class="active-pl-name-row">

  bindCurrentEvents(){
    const root   = this.currentEl;
    const filter = root.querySelector('.active-pl-filter');

    // compact transport mirrors the deck controls
    root.querySelector('.mini-play').onclick = () => player.el.play.onclick();

    root.querySelector('.mini-next').onclick = () => this.next();

    filter.addEventListener('input', () => this.applyFilter());
  },

  applyFilter(){
    const q = (this.currentEl.querySelector('.active-pl-filter').value || '').trim().toLowerCase();
    this.currentEl.querySelectorAll('.active-pl-tracks .track-item').forEach(el=>{
      el.style.display = el.querySelector('.name').textContent.toLowerCase().includes(q) ? '' : 'none';
    });
