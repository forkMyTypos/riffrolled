* { box-sizing: border-box; margin: 0; padding: 0; }

/* ── PLAYER ── */
.deck { display:flex; align-items:center; justify-content:center; position:relative; z-index:60; pointer-events:none; }
/* re-enable clicks only on the interactive bits so panels behind the deck's empty areas stay usable */
.deck .screen, .deck .np-area, .deck .np-area * { pointer-events:auto; }
.plinth {
  width:36rem; height:36rem;
 box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
 margin:2em;
  border-radius:1rem;
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.turntable { width:30rem; height:30rem; border-radius:50%; background:#0a0a0a; display:flex; align-items:center; justify-content:center; }
.platter {
  width:28rem; height:28rem; border-radius:50%;
  background:
    repeating-radial-gradient(circle at center, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px),
    radial-gradient(circle, #1c1c1c 0 18%, #0d0d0d 18% 70%, #000 70%);
  animation:spin 3.2s linear infinite; animation-play-state:paused;
}
.platter.playing { animation-play-state:running; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Video player — exactly 200x200, upright, unobscured (YouTube API requirement) */
.screen {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:200px; height:200px; border-radius:4px; overflow:hidden;
  background:#000; z-index:3;
  box-shadow:0 0 0 7px #0a0a0a, 0 10px 30px rgba(0,0,0,0.65);
}
.screen #ytFrame, .screen iframe { width:200px; height:200px; display:block; border:0; }
/* idle placeholder: shows YouTube's red play button over the (empty) player, like older versions; hidden once a track loads */
.screen-ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#000; z-index:4; pointer-events:none; }

/* Arm */
.arm { position:absolute; top:18px; right:28px; width:80px; height:150px; transform-origin:68px 16px; transform:rotate(-30deg); transition:transform 0.6s ease; pointer-events:none; }
.arm.playing { transform:rotate(-10deg); }
.arm-pivot { position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:#333; border:1px solid #555; }
.arm-rod   { position:absolute; top:16px; right:15px; width:3px; height:120px; background:linear-gradient(to bottom,#999,#555); border-radius:2px; transform:rotate(4deg); transform-origin:top center; }
.arm-head  { position:absolute; bottom:8px; right:8px; width:14px; height:5px; background:#444; border-radius:1px; }

/* Transport */
.np-area { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); width:28rem; max-width:92vw; display:flex; flex-direction:column; align-items:center; gap:7px; z-index:5; }
.np-title { font-size:12px; color:rgba(255,255,255,0.45); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; }
#npTitle { display:flex; align-items:center; justify-content:center; gap:6px; }
#npTitle .np-ico { width:14px; height:14px; flex-shrink:0; color:#8a7bff; opacity:.9; }

.np-meta { display:flex; gap:6px; width:100%; }

.react-btn.react-like:hover { border-color:rgba(90,184,138,0.55); color:#7fd6a6; }

.info-tabs { display:flex; gap:4px; padding:10px 12px 0; flex:0 0 auto; }

/* ── RIFFROLLED: roll feature + brand accents ── */
/* the logo dice tumble like they're mid-roll; each die pivots about its own centre */

.transport { display:flex; gap:10px; align-items:center; }

/* ── PANELS ── */
.panel { position:absolute; background:#1a1a2e; border-radius:0.6rem; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.08); min-width:220px; min-height:120px; resize:both; }

.panel-header { padding:10px 12px; background:rgba(255,255,255,0.05); cursor:move; font-size:13px; font-weight:600; user-select:none; display:flex; align-items:center; gap:6px; flex-shrink:0; border-bottom:1px solid rgba(255,255,255,0.07); }

.mainC { display:flex; flex-direction:column; min-height:0; overflow-y:auto; }

input[type=text], select { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:white; font-size:13px; padding:7px 10px; outline:none; transition:border-color .15s, background .15s; }

/* section block + heading used across panels */

/* ── PLAYLISTS PANEL ── */
.pl-item-count { font-size:11px; color:rgba(255,255,255,0.28); flex-shrink:0; }

/* ── LIBRARY ADD button (shared by Search Tracks) ── */

/* ── mini transport inside Current Playlist ── */
.mini-transport { margin-left:auto; display:flex; gap:4px; align-items:center; }
.mini-transport .icon-btn { width:26px; height:26px; font-size:11px; }
.mini-transport .mini-play { color:#c8bcff; background:rgba(140,123,255,0.16); border-color:rgba(140,123,255,0.38); }
.mini-transport .mini-play:hover { background:rgba(140,123,255,0.3); }

/* ── spin on/off switch under the deck ── */
.spin-toggle { display:flex; align-items:center; gap:8px; font-size:11px; color:rgba(255,255,255,0.55); user-select:none; cursor:pointer; margin-top:8px; }
.spin-toggle input { position:absolute; opacity:0; width:0; height:0; }
.spin-track {
  position:relative; width:46px; height:24px; border-radius:999px; flex-shrink:0;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.14);
  transition:background .2s, border-color .2s, box-shadow .2s;
}
.spin-thumb {
  position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:#cfcfcf; color:#333; font-size:10px;
  display:flex; align-items:center; justify-content:center;
  transition:left .2s, background .2s;
}
.spin-thumb::before { content:'♪'; }
.spin-toggle input:checked + .spin-track {
  background:linear-gradient(90deg,#6c5ce7,#8a7bff);
  border-color:rgba(140,123,255,0.65);
  box-shadow:0 0 10px rgba(140,123,255,0.5);
}
.spin-toggle input:checked + .spin-track .spin-thumb {
  left:24px; background:#fff; animation:thumbspin 2.4s linear infinite;
}
.spin-toggle input:focus-visible + .spin-track { outline:2px solid #8a7bff; outline-offset:2px; }
@keyframes thumbspin { to { transform:rotate(360deg); } }
.spin-label { letter-spacing:.03em; }

  if (kind === 'ok') b._t = setTimeout(function(){ b.hidden = true; }, 4000);
}

var db = new Dexie('VinylDB11');

db.version(2).stores({
  playlists: '++id, name, createdAt, plays, tags',
  tracks: '++id, ytId, name, artist, tags, plays',
  playlistTracks: '++id, playlistId, trackId, addedAt'

// v3 adds an explicit `order` field on join rows so tracks can be reordered.
db.version(3).stores({
  playlists: '++id, name, createdAt, plays, tags',
  tracks: '++id, ytId, name, artist, tags, plays',
  playlistTracks: '++id, playlistId, trackId, addedAt, order'
}).upgrade(async tx => {
  const rows = await tx.table('playlistTracks').toArray();
  rows.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
  const next = {};
  for (const r of rows){
    const n = (next[r.playlistId] = (next[r.playlistId] ?? -1) + 1);
    await tx.table('playlistTracks').update(r.id, { order: n });
  }
});

var dbBoss = {
  createPl: async function(n){
    if(!n) n = 'Playlist';
    return await db.playlists.add({ name: n, createdAt: Date.now() });
  },

  getPlaylists: async function(){
    return await db.playlists.orderBy('createdAt').reverse().toArray();
  },

  createTrack: async function(ytId, name){
    // ytId is interpolated into DOM attributes downstream — enforce its shape here
    if (!/^[A-Za-z0-9_-]{6,20}$/.test(String(ytId || ''))) throw new Error('Invalid video id');
    if(!name) name = 'track';
    name = String(name).slice(0, 300);
    let existing = await db.tracks.where('ytId').equals(ytId).first();
    if(existing) return existing.id;
    return await db.tracks.add({ ytId, name, createdAt: Date.now() });
  },

  // add an existing track to a playlist (appended to the end). returns 'added' | 'dupe'
  addToPlaylist: async function(playlistId, trackId){
    const exists = await db.playlistTracks.where({ playlistId, trackId }).first();
    if(exists) return 'dupe';
    const count = await db.playlistTracks.where('playlistId').equals(playlistId).count();
    await db.playlistTracks.add({ playlistId, trackId, addedAt: Date.now(), order: count });
    return 'added';
  },

  countTracks: async function(playlistId){
    return await db.playlistTracks.where('playlistId').equals(playlistId).count();
  },

  // record a play (powers the Links panel)
  logPlay: async function(ytId){
    if(!ytId) return;
    try {
      const t = await db.tracks.where('ytId').equals(ytId).first();
      await db.playHistory.add({ trackId: t ? t.id : null, ytId: ytId, ts: Date.now() });
    } catch(e){}
  },

  // bundle everything into a portable, id-independent object
  exportData: async function(){
    const tracks = await db.tracks.toArray();
    const playlists = await db.playlists.orderBy('createdAt').toArray();
    const out = { app:'vinyl-player', version:1, exportedAt: Date.now(), library:[], playlists:[] };
    out.library = tracks.map(t => ({ ytId:t.ytId, name:t.name }));
    for (const pl of playlists){
      const joins = await db.playlistTracks.where('playlistId').equals(pl.id).sortBy('order');
      const items = [];
      for (const j of joins){
        const tr = tracks.find(t => t.id === j.trackId);
        if (tr) items.push({ ytId:tr.ytId, name:tr.name });
      }
      out.playlists.push({ name: pl.name, tracks: items });
    }
    out.links = [];
    const allLinks = await db.trackLinks.toArray();
    for (const l of allLinks){
      const ta = tracks.find(t => t.id === l.a);
      const tb = tracks.find(t => t.id === l.b);
      if (ta && tb) out.links.push({ a: ta.ytId, b: tb.ytId });
    }
    return out;
  },

  // merge an exported object into the current data — no duplicates
  importData: async function(obj){
    if(!obj || (!obj.playlists && !obj.library)) throw new Error('unrecognised file');
    let addedTracks = 0, addedPlaylists = 0, addedJoins = 0, addedLinks = 0;

    if (Array.isArray(obj.library)){
      for (const t of obj.library){
        if(!t || !t.ytId) continue;
        const before = await db.tracks.where('ytId').equals(t.ytId).first();
        await this.createTrack(t.ytId, t.name);
        if(!before) addedTracks++;
      }
    }
    if (Array.isArray(obj.playlists)){
      for (const pl of obj.playlists){
        if(!pl || !pl.name) continue;
        const existing = await db.playlists.where('name').equals(pl.name).first();
        const plId = existing ? existing.id : await this.createPl(pl.name);
        if (!existing) addedPlaylists++;
        if (Array.isArray(pl.tracks)){
          for (const t of pl.tracks){
            if(!t || !t.ytId) continue;
            const trackId = await this.createTrack(t.ytId, t.name);
            const r = await this.addToPlaylist(plId, trackId);
            if (r === 'added') addedJoins++;
          }
        }
      }
    }
    if (Array.isArray(obj.links)){
      for (const l of obj.links){
        if(!l || !l.a || !l.b) continue;
        const ta = await db.tracks.where('ytId').equals(l.a).first();
        const tb = await db.tracks.where('ytId').equals(l.b).first();
        if (ta && tb){ const r = await this.linkTracks(ta.id, tb.id); if (r === 'added') addedLinks++; }
      }
    }
    return { addedTracks, addedPlaylists, addedJoins, addedLinks };
  },

  // ── explicit track <-> track links (undirected, stored as a<b) ──
  linkTracks: async function(id1, id2){
    if(!id1 || !id2 || id1 === id2) return 'invalid';
    const a = Math.min(id1, id2), b = Math.max(id1, id2);
    const exists = await db.trackLinks.where('a').equals(a).and(r => r.b === b).first();
    if (exists) return 'dupe';
    await db.trackLinks.add({ a, b, createdAt: Date.now() });
    return 'added';
  },

  unlinkTracks: async function(id1, id2){
    const a = Math.min(id1, id2), b = Math.max(id1, id2);
    const ex = await db.trackLinks.where('a').equals(a).and(r => r.b === b).first();
    if (ex) await db.trackLinks.delete(ex.id);
  },

  getLinkedTrackIds: async function(trackId){
    const asA = await db.trackLinks.where('a').equals(trackId).toArray();
    const asB = await db.trackLinks.where('b').equals(trackId).toArray();
    const ids = new Set();
    asA.forEach(r => ids.add(r.b));
    asB.forEach(r => ids.add(r.a));
    return [...ids];
  },

  getSetting: async function(k){ const r = await db.settings.get(k); return r ? r.v : null; },
  setSetting: async function(k, v){ await db.settings.put({ k:k, v:v }); },

  getTrack: async function(ytId){ return await db.tracks.where('ytId').equals(ytId).first(); },
  updateTrackMeta: async function(ytId, fields){
    const t = await db.tracks.where('ytId').equals(ytId).first();
    if (t) await db.tracks.update(t.id, fields);
  },
  addReaction: async function(ytId, kind){
    if(!ytId) return;
    const t = await db.tracks.where('ytId').equals(ytId).first();
    await db.reactions.add({ ytId:ytId, trackId: t ? t.id : null, kind:kind, ts: Date.now() });
  },
  // passive link tracking: "a played next to b". Normalised a<b, one row
  // per pair, count strengthens with every co-occurrence. Local only.
  recordPair: async function(prevYt, curYt){
    if (!prevYt || !curYt || prevYt === curYt) return;
    const a = prevYt < curYt ? prevYt : curYt;
    const b = prevYt < curYt ? curYt : prevYt;
    const key = a + '|' + b;
    const row = await db.trackPairs.where('key').equals(key).first();
    if (row) await db.trackPairs.update(row.id, { count: (row.count || 1) + 1, lastTs: Date.now() });
    else await db.trackPairs.add({ key, a, b, count: 1, lastTs: Date.now() });
  },

  // play counts per ytId from local history (for most/least-played mixes)
  getPlayCounts: async function(){
    const rows = await db.playHistory.toArray();
    const counts = {};
    rows.forEach(r => { if (r.ytId) counts[r.ytId] = (counts[r.ytId] || 0) + 1; });
    return counts;
  },

  getReactions: async function(ytId){
    const rows = await db.reactions.where('ytId').equals(ytId).toArray();
    let like = 0, dislike = 0;
    rows.forEach(r => { if (r.kind === 'like') like++; else if (r.kind === 'dislike') dislike++; });
    return { like:like, dislike:dislike };
  }
};

// surface storage failures instead of dying silently
db.open().catch(function(err){
  appNotify('Local storage couldn’t be opened, so your library can’t be saved or loaded. If you’re in private/incognito mode, try a normal window.', 'warn');
  console.error('Dexie open failed:', err);
});

window.addEventListener('unhandledrejection', function(e){
  var r = e && e.reason;
  var name = (r && (r.name || (r.constructor && r.constructor.name))) || '';
  var text = String((r && r.message) || r || '');
  if (/quota/i.test(name) || /quota/i.test(text)){
    appNotify('Storage is full — recent changes may not have saved. Export your data, then free up space.', 'warn');
  } else if (/database|dexie|indexeddb|transaction/i.test(name) || /indexeddb/i.test(text)){
    appNotify('A storage error occurred — a recent change may not have been saved.', 'warn');
  }
});

            +"<div class='flex alignMe title panel-header fs1em'>"+title+"<button class='panel-close' title='Close' aria-label='Close'>✕</button></div>"

let z=10;
// panels stay below the deck (z-index:60) so the record player is never covered by a menu
function bringToFront(el){ el.style.zIndex = Math.min(++z, 50); }

function makeDraggableEle(panel,handle){
  let d=false,ox=0,oy=0;
  handle.onmousedown=e=>{
    if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;
    bringToFront(panel); d=true;
    const r=panel.getBoundingClientRect();
    // work in page coordinates so a panel can be dragged down into the scrollable area
    ox=e.pageX-(r.left+window.scrollX);
    oy=e.pageY-(r.top+window.scrollY);
    document.onmousemove=ev=>{
      if(!d)return;
      panel.style.left=Math.max(0, ev.pageX-ox)+'px';
      panel.style.top=Math.max(0, ev.pageY-oy)+'px';
      panel.style.right='auto';
    };
    document.onmouseup=()=>{ if(d){ d=false; if(window.dock){ if(dock.markPlaced) dock.markPlaced(panel); if(dock.saveLayoutSoon) dock.saveLayoutSoon(); } } };
  };
}

<script>
/* ================================================================= */
/* ==  PLAYER  (was: player.javascript)                           == */
/* ================================================================= */





/* ── PLAYER / TRANSPORT CONTROLLER ── */
var player = {

  isPlaying: false,
  currentYtId: null,
  spinEnabled: true,

  yt: null,          // YT.Player instance
  ready: false,      // API + player ready
  pending: null,     // a track requested before the player was ready

  el: {
    platter: document.getElementById('platter'),
    arm:     document.getElementById('arm'),
    screenPh: document.getElementById('screenPh'),
    title:   document.querySelector('#npTitle .np-text'),
    panelTitle: document.querySelector('.ct-title'),
    play:    document.getElementById('btnPlay'),
    prev:    document.getElementById('btnPrev'),
    next:    document.getElementById('btnNext'),
    artist:       document.querySelector('.np-artist'),
    tags:         document.querySelector('.np-tags'),
    likeCount:    document.querySelector('.like-count'),
    dislikeCount: document.querySelector('.dislike-count')
  },

  // called once the IFrame API has loaded
  initApi: function () {
    var self = this;
    this.yt = new YT.Player('ytFrame', {
      width: 200, height: 200,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: function () {
          self.ready = true;
          if (self.pending) { var p = self.pending; self.pending = null; self.load(p.id, p.title); }
        },
        onStateChange: function (e) { self.onState(e); },
        onError: function (e) { self.onError(e); }
      }
    });
  },

  // unplayable video: tell the user and skip ahead (but stop if the whole queue keeps failing)
  onError: function (e) {
    var code = e && e.data, msg;
    if (code === 100)               msg = 'That video was removed or is private — skipping.';
    else if (code === 101 || code === 150) msg = 'The owner doesn’t allow this one to play in embeds — skipping.';
    else if (code === 2)            msg = 'That video link looks invalid — skipping.';
    else                            msg = 'This video couldn’t be played — skipping.';
    if (window.appNotify) appNotify(msg, 'warn');

    var qlen = (window.plBoss && plBoss.queue) ? plBoss.queue.length : 0;
    this._errStreak = (this._errStreak || 0) + 1;
    var cap = Math.min(qlen || 1, 10);
    if (qlen > 1 && this._errStreak < cap) {
      if (window.plBoss && plBoss.next) plBoss.next();
    } else if (this._errStreak >= cap) {
      if (window.appNotify) appNotify('Several videos in a row couldn’t be played — stopping.', 'warn');
      this._errStreak = 0;
    }
  },

  onState: function (e) {
    if (typeof YT === 'undefined') return;
    if (e.data === YT.PlayerState.ENDED)  { if (window.plBoss && plBoss.next) plBoss.next(); }
    else if (e.data === YT.PlayerState.PLAYING) { this._errStreak = 0; this.setPlaying(true); }
    else if (e.data === YT.PlayerState.PAUSED)  { this.setPlaying(false); }
  },

  load: function (ytId, title) {
    this.currentYtId = ytId;
    if (this.el.screenPh) this.el.screenPh.style.display = 'none';
    this.el.title.textContent = title || ytId;
    if (this.el.panelTitle) this.el.panelTitle.value = title || ytId;
    // pop the Current Track panel on a track change (toggle in that panel; on by default)
    if (window._ctAutoOpen && window.dock && !dock.mobile) {
      var ct = document.getElementById('ctPanel');
      if (ct) dock.openPanel(ct);
    }
    if (this.ready && this.yt && this.yt.loadVideoById) {
      this.yt.loadVideoById(ytId);
    } else {
      this.pending = { id: ytId, title: title };  // play as soon as the player is ready
    }
    this.setPlaying(true);
    if (window.dbBoss) {
      dbBoss.logPlay(ytId);
      // quiet local link tracking: this track followed the previous one
      if (this._lastYtId && this._lastYtId !== ytId) dbBoss.recordPair(this._lastYtId, ytId);
      this._lastYtId = ytId;
      if (window.promoTrack) promoTrack.event(ytId, 'play');
      this.refreshMeta(ytId, title || ytId);
    }
  },

  // ensure a track row exists, then populate artist/tags inputs + reaction counts
  refreshMeta: async function (ytId, title) {
    if (!window.dbBoss) return;
    try {
      await dbBoss.createTrack(ytId, title);
      const t  = await dbBoss.getTrack(ytId);
      const rc = await dbBoss.getReactions(ytId);
      if (this.currentYtId !== ytId) return;  // a newer track loaded while we awaited
      if (this.el.artist)       this.el.artist.value = (t && t.artist) || '';
      if (this.el.tags)         this.el.tags.value   = (t && t.tags)   || '';
      if (this.el.likeCount)    this.el.likeCount.textContent    = rc.like;
      if (this.el.dislikeCount) this.el.dislikeCount.textContent = rc.dislike;
    } catch (e) { /* meta is best-effort */ }
  },

  toggle: function () {
    if (!this.currentYtId) return;
    if (this.isPlaying) this.pause(); else this.resume();
  },

  pause:  function () { if (this.yt && this.yt.pauseVideo) this.yt.pauseVideo(); this.setPlaying(false); },
  resume: function () { if (this.yt && this.yt.playVideo)  this.yt.playVideo();  this.setPlaying(true);  },

  setPlaying: function (on) {
    this.isPlaying = on;
    this.el.platter.classList.toggle('playing', on && this.spinEnabled);
    this.el.arm.classList.toggle('playing', on);
    this.el.play.textContent = on ? '⏸' : '▶';
    if (window.plBoss && plBoss.updateStatus) plBoss.updateStatus();
    if (window.wakeBoss) wakeBoss.update();
  }
};

/* ── screen wake lock — phones suspend YouTube playback when the screen
   sleeps, so while a track is playing (and the toggle is on) we ask the
   browser to keep the screen awake. Auto-released on pause; re-acquired
   when the tab becomes visible again (locks always drop when hidden). ── */
var wakeBoss = {
  enabled: false,
  _lock: null,

  init(){
    var wrap = document.getElementById('wakeToggleWrap');
    var box = document.getElementById('wakeToggle');
    if (!('wakeLock' in navigator)){ if (wrap) wrap.style.display = 'none'; return; }
    var self = this;
    dbBoss.getSetting('wakeLock').then(function(v){
      self.enabled = v === '1';
      box.checked = self.enabled;
      self.update();
    });
    box.addEventListener('change', function(){
      self.enabled = box.checked;
      dbBoss.setSetting('wakeLock', self.enabled ? '1' : '0');
      self.update();
    });
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible') self.update();
    });
  },

  async update(){
    var want = this.enabled && window.player && player.isPlaying;
    if (want && !this._lock){
      try {
        this._lock = await navigator.wakeLock.request('screen');
        var self = this;
        this._lock.addEventListener('release', function(){ self._lock = null; });
      } catch(e){ /* denied (e.g. low battery mode) — playback still works while screen is on */ }
    } else if (!want && this._lock){
      try { this._lock.release(); } catch(e){}
      this._lock = null;
    }
  }
};
wakeBoss.init();

/* ── promoted-track counters. Keeps the list of currently promoted video
   ids so a play or a like on one can nudge an anonymous counter on the
   promotion row. No wallet, no device id, no history is sent — just
   "this promotion got another play", once per browser session. ── */
var promoTrack = {
  ids: new Set(),
  _sent: new Set(),
  async refresh(){
    try {
      var r = await fetch('/api/promotions');
      if (!r.ok) return;
      var list = await r.json();
      this.ids = new Set(list.map(function(p){
        var m = /[?&]v=([A-Za-z0-9_-]{11})/.exec(p.url || '');
        return m ? m[1] : null;
      }).filter(Boolean));
    } catch(e){ /* offline: counters simply don't fire */ }
  },
  event(ytId, kind){
    if (!ytId || !this.ids.has(ytId)) return;
    var key = kind + ':' + ytId;
    if (this._sent.has(key)) return;         // once per session per track
    this._sent.add(key);
    try {
      fetch('/api/promo/event', { method:'POST', headers:{ 'content-type':'application/json' },
        body: JSON.stringify({ url: 'https://www.youtube.com/watch?v=' + ytId, kind: kind }) });
    } catch(e){}
  }
};
promoTrack.refresh();

/* ── hover preview. YouTube publishes thumbnails on a plain CDN path —
   no API key, no quota — so dwelling on any row with a data-yt shows a
   small still. Pointer devices only; touch has no hover to speak of. ── */
var thumbPeek = {
  DELAY: 550,

  init(){
    if (!window.matchMedia || !matchMedia('(hover: hover)').matches) return;
    var pop = document.createElement('div');
    pop.id = 'thumbPop';
    var img = document.createElement('img');
    img.alt = '';
    pop.appendChild(img);
    document.body.appendChild(pop);
    this.pop = pop; this.img = img;

    var self = this;
    document.addEventListener('mouseover', function(e){
      var row = e.target.closest && e.target.closest('[data-yt]');
      if (!row || row === self._row) return;
      self.cancel();
      var id = row.dataset.yt || '';
      if (!/^[A-Za-z0-9_-]{6,20}$/.test(id)) return;
      self._row = row;
      self._t = setTimeout(function(){ self.show(id, row); }, self.DELAY);
    });
    // ignore moves between a row's own children — only a real exit cancels
    document.addEventListener('mouseout', function(e){
      if (!self._row) return;
      var to = e.relatedTarget;
      if (to && self._row.contains(to)) return;
      self.cancel();
    });
    window.addEventListener('scroll', function(){ self.cancel(); }, true);
    document.addEventListener('click', function(){ self.cancel(); });
  },

  show(id, row){
    var self = this;
    this.img.onerror = function(){ self.cancel(); };   // no thumbnail: show nothing
    this.img.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
    var r = row.getBoundingClientRect(), w = 200, h = 112, gap = 10;
    var left = r.left - w - gap;
    if (left < 8) left = Math.min(r.right + gap, window.innerWidth - w - 8);
    var top = Math.min(Math.max(8, r.top - 18), window.innerHeight - h - 8);
    this.pop.style.left = left + 'px';
    this.pop.style.top = top + 'px';
    this.pop.classList.add('show');
  },

  cancel(){
    clearTimeout(this._t);
    this._row = null;
    if (this.pop) this.pop.classList.remove('show');
  }
};
thumbPeek.init();

function ytPlay(id, title) { player.load(id, title); }

// the IFrame API calls this global when it finishes loading
function onYouTubeIframeAPIReady() { player.initApi(); }

// load the IFrame API (reliable onStateChange / auto-advance, unlike raw postMessage)
(function(){

  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();

// spin on/off switch
(function(){
  var t = document.getElementById('spinToggle');
  if (!t) return;
  t.addEventListener('change', function(){
    player.spinEnabled = t.checked;
    player.el.platter.classList.toggle('playing', player.isPlaying && player.spinEnabled);
  });
})();

// now-playing meta: save artist/tags edits; like/dislike tally (can react repeatedly)
(function(){
  var artist  = document.querySelector('.np-artist');
  var tags    = document.querySelector('.np-tags');
  var like    = document.querySelector('.react-like');
  var dislike = document.querySelector('.react-dislike');

  if (artist) artist.addEventListener('change', function(){
    if (player.currentYtId && window.dbBoss) dbBoss.updateTrackMeta(player.currentYtId, { artist: artist.value.trim() });
  });
  if (tags) tags.addEventListener('change', function(){
    if (player.currentYtId && window.dbBoss) dbBoss.updateTrackMeta(player.currentYtId, { tags: tags.value.trim() });
  });

  function react(kind){
    return async function(){
      if (!player.currentYtId || !window.dbBoss) return;
      await dbBoss.addReaction(player.currentYtId, kind);
      if (kind === 'like' && window.promoTrack) promoTrack.event(player.currentYtId, 'like');
      player.refreshMeta(player.currentYtId, player.el.title ? player.el.title.textContent : player.currentYtId);
    };
  }
  if (like)    like.onclick    = react('like');
  if (dislike) dislike.onclick = react('dislike');

  // edit the current track's title from the Current Track panel
  var titleEdit = document.querySelector('.ct-title');
  if (titleEdit) titleEdit.addEventListener('change', async function(){
    if (!player.currentYtId || !window.dbBoss) return;
    var name = titleEdit.value.trim();
    if (!name) return;
    await dbBoss.updateTrackMeta(player.currentYtId, { name: name });
    if (player.el.title) player.el.title.textContent = name;          // deck title
    if (window.plBoss) { await plBoss.renderTracks(); plBoss.renderPlaylists(); }
    if (window.searchBoss) searchBoss.render();
  });

  // "pop up on track change" toggle (persisted; on by default)
  window._ctAutoOpen = true;
  var autopop = document.querySelector('.ct-autopop-cb');
  if (autopop && window.dbBoss) {
    dbBoss.getSetting('ctAutoOpen').then(function(v){
      var on = (v === null || v === undefined) ? true : !!v;
      autopop.checked = on;
      window._ctAutoOpen = on;
    });
    autopop.addEventListener('change', function(){
      window._ctAutoOpen = autopop.checked;
      dbBoss.setSetting('ctAutoOpen', autopop.checked);
    });
  }
})();

<script>
/* ================================================================= */
/* ==  PLAYLIST  (was: playlist.javascript)                       == */
/* ================================================================= */

var plBoss = {

  queue: [],
  currentIndex: -1,

  async setup(){
    this.currentM();        // the one merged Playlist panel
    this.bindTransport();
    this.bindKeys();
    this.updateStatus();
    await this.renderPlaylists();   // picks the first playlist if none active
  },

  /* ── TRANSPORT + KEYS ── */
  bindTransport(){
    player.el.play.onclick = () => {
      if (!player.currentYtId && this.queue.length) this.playIndex(0);
      else player.toggle();
    };
    player.el.prev.onclick = () => this.prev();
    player.el.next.onclick = () => this.next();
  },

  bindKeys(){
    document.addEventListener('keydown', (e)=>{
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      if (e.code === 'Space'){ e.preventDefault(); player.el.play.onclick(); }
      else if (e.code === 'ArrowRight'){ this.next(); }
      else if (e.code === 'ArrowLeft'){ this.prev(); }
    });
  },

  playIndex(i){
    if (i < 0 || i >= this.queue.length) return;
    this.currentIndex = i;
    const t = this.queue[i];
    player.load(t.ytId, t.name);
    this.syncHighlight();
  },

  next(){ if (this.queue.length) this.playIndex((this.currentIndex + 1) % this.queue.length); },
  prev(){ if (this.queue.length) this.playIndex((this.currentIndex - 1 + this.queue.length) % this.queue.length); },

  syncHighlight(){
    const c = this.currentEl.querySelector('.active-pl-tracks');
    if (!c) return;
    c.querySelectorAll('.track-item').forEach(el=>{
      el.classList.toggle('active', Number(el.dataset.i) === this.currentIndex);
    });
  },

  updateStatus(){
    if (!this.currentEl) return;
    const mini = this.currentEl.querySelector('.mini-play');
    if (mini) mini.textContent = player.isPlaying ? '⏸' : '▶';
    const el = this.currentEl.querySelector('.pl-status');
    if (!el) return;
    if (!player.currentYtId){
      el.textContent = '■ Stopped'; el.style.color = 'rgba(255,255,255,0.4)'; return;
    }
    const inThis = this.queue.some(t => t.ytId === player.currentYtId);
    if (player.isPlaying){
      el.textContent = inThis ? '▶ Playing' : '▶ Playing (another playlist)';
      el.style.color = '#5ab88a';
    } else {
      el.textContent = '❚❚ Paused'; el.style.color = '#d8a657';
    }
  },

  msg(text, kind){
    const m = this.currentEl && this.currentEl.querySelector('.active-pl-msg');
    if (!m) return;
    m.textContent = text || '';
    m.style.color = kind === 'err' ? '#d46060' : kind === 'ok' ? '#5ab88a' : 'rgba(255,255,255,0.45)';
    if (text){ clearTimeout(this._msgT); this._msgT = setTimeout(()=>{ if (m.textContent === text) m.textContent=''; }, 4000); }
  },

  // re-render everything that can change after a DB write
  afterDbChange(){
    this.renderTracks();
    this.renderPlaylists();
    if (window.searchBoss) searchBoss.render();
  },

  /* ── PLAYLIST PANEL (merged: pick/search/create + current playlist) ── */
  currentM(){
    var title = `🎶 Playlist`;
    var main = `
      <div class="active-pl">

        <div class="pl-toolbar">
          <div class="pl-srh-wrap">
            <input type="text" class="pl-srh" placeholder="🔍 Your playlists…">
            <div class="pl-pop scrollable"></div>
          </div>
        </div>

        <div class="active-pl-header">
          <span class="pl-status">■ Stopped</span>
        </div>

        <div class="active-pl-name-row">
          <span class="pl-name-icon">🎶</span>
          <button class="icon-btn pl-add" title="New playlist (uses the search text as its name)">＋</button>
          <input type="text" class="active-pl-name" value="No playlist" title="Rename this playlist">
        </div>

        <div class="active-pl-sub">
          <span>Tracks</span><span class="count">· 0</span>
          <button class="icon-btn add-track-btn" title="Add tracks (opens the Tracks panel)">＋</button>
          <div class="mini-transport">
            <button class="icon-btn mini-prev" title="Previous">⏮</button>
            <button class="icon-btn mini-play" title="Play / pause">▶</button>
            <button class="icon-btn mini-next" title="Next">⏭</button>
          </div>
        </div>

        <div class="active-pl-msg"></div>

        <div class="active-pl-tracks"></div>


      </div>
    `;
    this.currentEl = menuB.createMenu(title, main);
    menuB.place(this.currentEl, { right:'92px', top:'48px', width:'340px', height:'520px' });

    // dynamic "Playlist — {name}" in the header
    const hdr = this.currentEl.querySelector('.panel-header');
    const nameSpan = document.createElement('span');
    nameSpan.className = 'pl-title-name';
    hdr.insertBefore(nameSpan, hdr.querySelector('.panel-close'));

    this.bindCurrentEvents();
  },

  setTitleName(name){
    const s = this.currentEl.querySelector('.pl-title-name');
    if (s) s.textContent = name ? ' — ' + name : '';
  },

  bindCurrentEvents(){
    const root   = this.currentEl;

    // ── playlist search popup ──
    const srh = root.querySelector('.pl-srh');
    const pop = root.querySelector('.pl-pop');
    const openPop = () => { pop.classList.add('open'); this.renderPlPopup(); };
    srh.addEventListener('focus', openPop);
    srh.addEventListener('input', () => { pop.classList.add('open'); this.renderPlPopup(); });
    document.addEventListener('click', (e) => {
      if (!e.target.closest || !e.target.closest('.pl-srh-wrap')) pop.classList.remove('open');
    });
    // one delegated handler: pick a playlist, or delete one
    pop.addEventListener('click', async (e) => {
      const del = e.target.closest('.del-btn');
      if (del){ e.stopPropagation(); await this.deletePlaylist(Number(del.dataset.id)); this.renderPlPopup(); return; }
      const item = e.target.closest('.pl-item');
      if (item){
        await this.setActivePlaylist(Number(item.dataset.id));
        pop.classList.remove('open');
        srh.value = '';
      }
    });

    // ── ＋ new playlist (uses the search text as the name if present) ──
    root.querySelector('.pl-add').onclick = async () => {
      const name = srh.value.trim() || 'New Playlist';
      const id = await dbBoss.createPl(name);
      srh.value = '';
      pop.classList.remove('open');
      await this.setActivePlaylist(id);
      const nameInput = root.querySelector('.active-pl-name');
      nameInput.focus(); nameInput.select();     // invite an immediate rename
    };

    // ── ＋ add tracks → open the Tracks panel ──
    root.querySelector('.add-track-btn').onclick = () => {
      if (window.dock && window.importBoss) dock.openPanel(importBoss.el);
    };

  },


  // popup list of playlists, filtered by the search box
  async renderPlPopup(){
    const root = this.currentEl;
    const pop = root.querySelector('.pl-pop');
    if (!pop || !pop.classList.contains('open')) return;
    const q = (root.querySelector('.pl-srh').value || '').trim().toLowerCase();
    const pls = await dbBoss.getPlaylists();
    const shown = q ? pls.filter(p => p.name.toLowerCase().includes(q)) : pls;
    if (!shown.length){
      pop.innerHTML = `<div class="empty">${pls.length ? 'No matches' : 'No playlists yet — hit ＋'}</div>`;
      return;
    }
    const counts = {};
    await Promise.all(shown.map(async pl=>{ counts[pl.id] = await dbBoss.countTracks(pl.id); }));
    pop.innerHTML = shown.map(pl => `
      <div class="row-item pl-item ${pl.id === this.activeId ? 'active' : ''}" data-id="${pl.id}">
        <span class="name pl-item-name">${escapeHtml(pl.name)}</span>
        <span class="pl-item-count">${counts[pl.id]}</span>
        <button class="del-btn" data-id="${pl.id}" title="Delete playlist">✕</button>
      </div>
    `).join('');
  },

  // kept name: everything that used to refresh the Playlists panel calls this
  async renderPlaylists(){
    this.renderPlPopup();
    if (!this.activeId){
      const pls = await dbBoss.getPlaylists();
      if (pls.length) await this.setActivePlaylist(pls[0].id);
      else this.setTitleName('');
    }
  },

  async deletePlaylist(id){
    await db.playlists.delete(id);
    const joins = await db.playlistTracks.where('playlistId').equals(id).toArray();
    await db.playlistTracks.bulkDelete(joins.map(j => j.id));
    if (this.activeId === id) this.activeId = null;

    if (!this.activeId){
      const remaining = await dbBoss.getPlaylists();
      if (remaining.length){
        await this.setActivePlaylist(remaining[0].id);
      } else {
        this.setTitleName('');
        this.currentEl.querySelector('.active-pl-name').value = 'No playlist';
        this.currentEl.querySelector('.active-pl-tracks').innerHTML = `<div class="empty">No playlist selected</div>`;
        this.currentEl.querySelector('.active-pl-sub .count').textContent = '· 0';
        this.queue = []; this.currentIndex = -1; this.updateStatus();
      }
    }
  },


  /* ── STATE ── */
  async setActivePlaylist(id){
    this.activeId = id;
    const pl = await db.playlists.get(id);
    if (!pl) return;

    this.setTitleName(pl.name);
    const nameInput = this.currentEl.querySelector('.active-pl-name');
    nameInput.value = pl.name;
    nameInput.onchange = async () => {
      const newName = nameInput.value.trim();
      if(!newName) return;
      await db.playlists.update(id, { name: newName });
      this.setTitleName(newName);
      this.renderPlPopup();
    };

    if (window.searchBoss) searchBoss.render();
    this.renderTracks();
  },

  /* ── TRACKS (ordered + drag-reorderable) ── */
  async renderTracks(){
    const container = this.currentEl.querySelector('.active-pl-tracks');
    const countEl = this.currentEl.querySelector('.active-pl-sub .count');

    if(!this.activeId){
      container.innerHTML = `<div class="empty">No playlist selected</div>`;
      countEl.textContent = '· 0';
      this.queue = []; this.currentIndex = -1; this.updateStatus();
      return;
    }

    const joins = await db.playlistTracks.where('playlistId').equals(this.activeId).sortBy('order');
    countEl.textContent = '· ' + joins.length;

    if(!joins.length){
      container.innerHTML = `<div class="empty">No tracks yet.<br>Hit ＋ above to add from your library.</div>`;
      this.queue = []; this.currentIndex = -1; this.updateStatus();
      return;
    }

    const tracks = await db.tracks.bulkGet(joins.map(j => j.trackId));
    this.queue = tracks
      .map((t, i) => t ? { ytId: t.ytId, name: t.name, joinId: joins[i].id } : null)
      .filter(Boolean);

    this.currentIndex = this.queue.findIndex(t => t.ytId === player.currentYtId);

    container.innerHTML = this.queue.map((t, i)=>`
      <div class="row-item track-item" data-i="${i}" data-yt="${escapeHtml(t.ytId)}" draggable="true">
        <span class="track-handle" title="Drag to reorder">⠿</span>
        <span class="track-num">${i+1}</span>
        ${ t.ytId === player.currentYtId ? `<span class="now-dot">♪</span>` : '' }
        <span class="name">${escapeHtml(t.name)}</span>
        <button class="del-btn" data-join="${t.joinId}" title="Remove from playlist">✕</button>
      </div>
    `).join('');

    // play on click
    container.querySelectorAll('.track-item').forEach(el=>{
      el.onclick = (e) => {
        if (e.target.classList.contains('del-btn') || e.target.classList.contains('track-handle')) return;
        this.playIndex(Number(el.dataset.i));
      };
    });

    // remove
    container.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        await db.playlistTracks.delete(Number(btn.dataset.join));
        await this.renderTracks();
        this.renderPlaylists();
        if (window.searchBoss) searchBoss.render();
      };
    });

    // drag-to-reorder (mouse: native HTML5 DnD)
    let dragFrom = null;
    container.querySelectorAll('.track-item').forEach(el=>{
      el.addEventListener('dragstart', (e)=>{ dragFrom = Number(el.dataset.i); el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
      el.addEventListener('dragend',   ()=>{ el.classList.remove('dragging'); container.querySelectorAll('.track-item').forEach(x=>x.classList.remove('drop-into')); });
      el.addEventListener('dragover',  (e)=>{ e.preventDefault(); el.classList.add('drop-into'); });
      el.addEventListener('dragleave', ()=> el.classList.remove('drop-into'));
      el.addEventListener('drop', async (e)=>{
        e.preventDefault();
        el.classList.remove('drop-into');
        const to = Number(el.dataset.i);
        if (dragFrom === null || dragFrom === to) return;
        await this.reorder(dragFrom, to);
        dragFrom = null;
      });
    });

    // drag-to-reorder (touch / pen: native DnD doesn't fire, so drive it from the handle with pointer events)
    const self = this;
    let pFrom = null, pOver = null;
    const clearMarks = () => container.querySelectorAll('.track-item').forEach(x=>x.classList.remove('drop-into'));
    const onPMove = (ev) => {
      if (pFrom === null) return;
      ev.preventDefault();
      const over = document.elementFromPoint(ev.clientX, ev.clientY);
      const it = over && over.closest ? over.closest('.track-item') : null;
      clearMarks();
      if (it && Number(it.dataset.i) !== pFrom){ it.classList.add('drop-into'); pOver = Number(it.dataset.i); }
      else pOver = null;
    };
    const onPUp = async () => {
      document.removeEventListener('pointermove', onPMove);
      document.removeEventListener('pointerup', onPUp);
      document.removeEventListener('pointercancel', onPUp);
      container.querySelectorAll('.track-item').forEach(x=>x.classList.remove('dragging'));
      clearMarks();
      const from = pFrom, to = pOver;
      pFrom = pOver = null;
      if (from !== null && to !== null && to !== from) await self.reorder(from, to);
    };
    container.querySelectorAll('.track-item').forEach(el=>{
      const handle = el.querySelector('.track-handle');
      if (!handle) return;
      handle.addEventListener('pointerdown', (e)=>{
        if (e.pointerType === 'mouse') return;   // desktop mouse keeps native drag-and-drop
        e.preventDefault();
        pFrom = Number(el.dataset.i); pOver = null;
        el.classList.add('dragging');
        document.addEventListener('pointermove', onPMove, { passive:false });
        document.addEventListener('pointerup', onPUp);
        document.addEventListener('pointercancel', onPUp);
      });
    });

    this.syncHighlight();
    this.updateStatus();
  },

  async reorder(from, to){
    const moved = this.queue.splice(from, 1)[0];
    this.queue.splice(to, 0, moved);
    // persist the new order onto the join rows
    await Promise.all(this.queue.map((t, i) => db.playlistTracks.update(t.joinId, { order: i })));
    await this.renderTracks();
  }

};


/* ── SEARCH TRACKS PANEL (search the whole library) ── */
/* ── SEARCH — one box across your library. Scope: Tracks / Playlists / Both.
   The limits row caps how many result rows get built (DOM stays small as
   the library grows); "All" is available but capped at 500 for safety. ── */
var searchBoss = {
  scope: 'both',
  limit: 20,

  setup(){
    var main =
      "<div class='sec searchC'>" +
        "<div class='row srh-top'>" +
          "<div class='srh-scopes'>" +
            "<button class='srh-scope' data-s='tracks' title='Search tracks'>🎵</button>" +
            "<button class='srh-scope' data-s='playlists' title='Search playlists'>📃</button>" +
            "<button class='srh-scope active' data-s='both' title='Search both'>∞</button>" +
          "</div>" +
          "<input type='text' class='st-search' placeholder='Search your library…'>" +
        "</div>" +
        "<div class='st-results scrollable'></div>" +
        "<div class='srh-limits'>" +
          "<span class='srh-limits-label'>Show</span>" +
          "<button class='srh-limit' data-n='10'>10</button>" +
          "<button class='srh-limit active' data-n='20'>20</button>" +
          "<button class='srh-limit' data-n='50'>50</button>" +
          "<button class='srh-limit' data-n='500'>All</button>" +
        "</div>" +
        "<div class='status-bar st-status'></div>" +
      "</div>";
    this.el = menuB.createMenu('🔎 Search', main);
    menuB.place(this.el, { right:'470px', top:'120px', width:'320px', height:'360px' });

    var self = this;
    var input = this.el.querySelector('.st-search');
    input.addEventListener('input', function(){ clearTimeout(self._t); self._t = setTimeout(function(){ self.render(); }, 140); });

    // scope + limit toggles (delegated)
    this.el.querySelector('.srh-scopes').addEventListener('click', function(e){
      var b = e.target.closest('.srh-scope'); if (!b) return;
      self.scope = b.dataset.s;
      self.el.querySelectorAll('.srh-scope').forEach(function(x){ x.classList.toggle('active', x === b); });
      self.render();
    });
    this.el.querySelector('.srh-limits').addEventListener('click', function(e){
      var b = e.target.closest('.srh-limit'); if (!b) return;
      self.limit = Number(b.dataset.n) || 20;
      self.el.querySelectorAll('.srh-limit').forEach(function(x){ x.classList.toggle('active', x === b); });
      self.render();
    });

    // one delegated handler for all result rows
    this.el.querySelector('.st-results').addEventListener('click', async function(e){
      var plRow = e.target.closest('.srh-pl');
      if (plRow){ await plBoss.setActivePlaylist(Number(plRow.dataset.id)); self.status('Now on “' + plRow.dataset.name + '”', 'ok'); self.render(); return; }
      var item = e.target.closest('.st-item'); if (!item) return;
      if (e.target.closest('.st-play')){ ytPlay(item.dataset.yt, item.dataset.name); return; }
      if (e.target.closest('.st-add')){
        if (!window.plBoss || !plBoss.activeId){ self.status('Select a playlist first', 'err'); return; }
        var r = await dbBoss.addToPlaylist(plBoss.activeId, Number(item.dataset.id));
        self.status(r === 'dupe' ? 'Already in current playlist' : 'Added ✓', r === 'dupe' ? null : 'ok');
        plBoss.afterDbChange();
      }
    });

    this.render();
  },

  status(msg, kind){
    var el = this.el.querySelector('.st-status');
    el.textContent = msg || '';
    el.className = 'status-bar st-status' + (kind ? ' ' + kind : '');
    var self = this;
    if (msg && kind === 'ok'){ clearTimeout(this._st); this._st = setTimeout(function(){ if (el.textContent === msg) self.status(''); }, 5000); }
  },

  async render(){
    var results = this.el.querySelector('.st-results');
    var q = (this.el.querySelector('.st-search').value || '').trim().toLowerCase();
    var cap = this.limit, html = '', total = 0;


    // playlists section
    if (this.scope !== 'tracks'){
      var pls = await dbBoss.getPlaylists();
      var mp = q ? pls.filter(function(p){ return p.name.toLowerCase().includes(q); }) : pls;
      total += mp.length;
      var showP = mp.slice(0, cap);
      if (showP.length){
        var counts = {};
        await Promise.all(showP.map(async function(pl){ counts[pl.id] = await dbBoss.countTracks(pl.id); }));
        html += "<div class='srh-sec-head'>Playlists</div>" + showP.map(function(pl){
          return "<div class='row-item srh-pl" + (pl.id === plBoss.activeId ? " active" : "") + "' data-id='" + pl.id + "' data-name='" + escapeHtml(pl.name) + "'>"
            + "<span class='name'>" + escapeHtml(pl.name) + "</span>"
            + "<span class='pl-item-count'>" + counts[pl.id] + "</span></div>";
        }).join('');
      }
    }

    // tracks section
    if (this.scope !== 'playlists'){
      var all = await db.tracks.toArray();
      var mt = q ? all.filter(function(t){ return (t.name || '').toLowerCase().includes(q); }) : all;
      total += mt.length;
      var inList = new Set();
      if (plBoss.activeId){
        var joins = await db.playlistTracks.where('playlistId').equals(plBoss.activeId).toArray();
        joins.forEach(function(j){ inList.add(j.trackId); });
      }
      var showT = mt.slice(0, cap);
      if (showT.length){
        html += "<div class='srh-sec-head'>Tracks</div>" + showT.map(function(t){
          return "<div class='st-item' data-id='" + t.id + "' data-yt='" + escapeHtml(t.ytId) + "' data-name='" + escapeHtml(t.name) + "'>"
            + "<button class='icon-btn st-play' title='Play now'>▶</button>"

            + "</div>";
        }).join('');
      }
    }

    if (!html) html = "<div class='empty'>" + (q ? 'No matches' : 'Your library is empty') + "</div>";
    results.innerHTML = html;   // one DOM write, capped row count
    var shown = Math.min(total, cap * (this.scope === 'both' ? 2 : 1));
    this.status(total > shown ? ('Showing ' + shown + ' of ' + total) : '');
  }
};

  /* Build a fresh playlist from the local library.
     Pool: all local tracks, optionally narrowed by tags (comma list, any match).
     Bias: random shuffle · most played · least played (from local play history). */
  async buildMix(){
    const root = this.el;
    const tagsQ = (root.querySelector('.mix-tags').value || '').trim().toLowerCase();
    const bias  = root.querySelector('.mix-bias').value;
    const n     = parseInt(root.querySelector('.mix-count').value, 10) || 20;

    let pool = await db.tracks.toArray();
    if (tagsQ){
      const wanted = tagsQ.split(',').map(s => s.trim()).filter(Boolean);
      pool = pool.filter(t => {
        const tt = (t.tags || '').toLowerCase();
        return wanted.some(w => tt.includes(w));
      });
    }
    if (!pool.length){ this.mixStatus(tagsQ ? 'No tracks match those tags' : 'Your library is empty', 'err'); return; }

    if (bias === 'random'){
      for (let i = pool.length - 1; i > 0; i--){          // Fisher–Yates
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    } else {
      const counts = await dbBoss.getPlayCounts();
      const c = t => counts[t.ytId] || 0;
      // tiny random jitter so equal-count tracks vary between builds
      pool.sort((x, y) => (bias === 'most' ? c(y) - c(x) : c(x) - c(y)) || Math.random() - 0.5);
    }

    const picks = pool.slice(0, n);

    // unique "Mix" name: Mix 1, Mix 2, …
    const pls = await dbBoss.getPlaylists();
    let num = 1;
    while (pls.some(p => p.name === 'Mix ' + num)) num++;
    const label = { random:'', most:' · most played', least:' · least played' }[bias] || '';
    const name = 'Mix ' + num + (tagsQ ? ' · ' + tagsQ : '') + label;

    const plId = await dbBoss.createPl(name);
    for (const t of picks) await dbBoss.addToPlaylist(plId, t.id);
    await plBoss.setActivePlaylist(plId);
    plBoss.renderPlPopup();
    this.mixStatus('Built “' + name + '” with ' + picks.length + ' tracks', 'ok');
  },
};

/* ── RIFF MINE — hashcash proof-of-work token mining (RPOW spirit).
   The server issues a challenge; a Web Worker grinds SHA-256(challenge:nonce)
   until it has enough leading zero bits; the server verifies with one hash
   and credits the ledger. Wallet = a random bearer key kept in local settings:
   guard it like a password, lose it and the balance is gone. ── */
/* the anonymous wallet key both mining and promoting sit on top of */
var riffWallet = {
  async get(){
    if (this._w) return this._w;
    let w = await dbBoss.getSetting('wallet');
    if (!w){
      const a = new Uint8Array(32); crypto.getRandomValues(a);
      w = [...a].map(b => b.toString(16).padStart(2, '0')).join('');
      await dbBoss.setSetting('wallet', w);
    }
    this._w = w;
    return w;
  }
};

    menuB.place(this.el, { right:'800px', top:'120px', width:'300px' });

    var self = this;
    this.el.querySelector('.mine-toggle').onclick = function(){ self.running ? self.stop() : self.start(); };
    this.bindWallet();
    this.refresh();
  },

  /* first tokens earned: say once, plainly, that the key is the balance.
     Nobody reads the fine print until they've lost something. */
  async nudgeBackup(){
    if (this._nudged) return;
    this._nudged = true;
    if (await dbBoss.getSetting('walletNudged')) return;
    await dbBoss.setSetting('walletNudged', '1');
    appNotify('Your tokens belong to your wallet key, not this browser — copy it from the Mine panel and keep it safe. Clearing site data without it loses the balance for good.', 'warn');
    var sec = this.el.querySelector('.wallet-sec');
    if (sec){ sec.classList.add('flash'); setTimeout(function(){ sec.classList.remove('flash'); }, 3000); }
  },

  /* view / copy / restore the wallet key — the only thing standing between
     a user and their balance, so it must be portable */
  bindWallet(){
    var self = this;
    var input = this.el.querySelector('.wallet-key');
    var st = this.el.querySelector('.wallet-status');
    function say(msg, kind){
      st.textContent = msg || '';
      st.className = 'status-bar wallet-status' + (kind ? ' ' + kind : '');
      if (msg && kind === 'ok') setTimeout(function(){ if (st.textContent === msg) say(''); }, 5000);
    }
    riffWallet.get().then(function(w){ input.value = w; });

    this.el.querySelector('.wallet-copy').onclick = async function(){
      try { await navigator.clipboard.writeText(input.value.trim()); say('Key copied — store it somewhere safe', 'ok'); }
      catch(e){ input.select(); say('Press Ctrl/Cmd+C to copy', null); }
    };

    this.el.querySelector('.wallet-save').onclick = async function(){
      var k = input.value.trim().toLowerCase();
      if (!/^[0-9a-f]{64}$/.test(k)){ say('That is not a valid wallet key (64 hex characters)', 'err'); return; }
      await dbBoss.setSetting('wallet', k);
      riffWallet._w = k;
      say('Wallet key set for this device', 'ok');
      self.refresh();
      if (window.promoBoss) promoBoss.refresh();
    };
  },

  status(msg, kind){
    var el = this.el.querySelector('.mine-status');
    el.textContent = msg || '';
    el.className = 'status-bar mine-status' + (kind ? ' ' + kind : '');
  },

  async refresh(){
    try {
      var w = await this.wallet();
      var r = await fetch('/api/wallet?wallet=' + w);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var d = await r.json();
      this.el.querySelector('.mine-bal').textContent = d.balance;
      this.el.querySelector('.mine-today').textContent = d.mined_today + ' / ' + d.daily_cap;
      this._promoteCost = d.promote_cost;
      return d;
    } catch(e){
      this.status('Wallet unavailable: ' + e.message, 'err');
      return null;
    }
  },

  // inline Web Worker: batches of SHA-256 attempts, reports rate, returns a hit
  workerUrl(){
    if (this._wurl) return this._wurl;
    var src =
      "onmessage=async function(e){" +
        "var c=e.data.challenge,bits=e.data.bits,enc=new TextEncoder(),n=0,t0=Date.now();" +
        "function lz(u){var b=0;for(var i=0;i<u.length;i++){var v=u[i];if(v===0){b+=8;continue}while((v&128)===0){b++;v=(v<<1)&255}break}return b}" +
        "while(true){" +
          "var nonce=(Math.random()*1e17>>>0).toString(36)+n.toString(36);" +
          "var d=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(c+':'+nonce)));" +
          "if(lz(d)>=bits){postMessage({found:nonce,attempts:n});return}" +
          "n++;" +
          "if(n%2000===0){postMessage({attempts:n,rate:Math.round(n/((Date.now()-t0)/1000))});" +
            "await new Promise(function(r){setTimeout(r,0)})}" +
        "}" +
      "};";
    this._wurl = URL.createObjectURL(new Blob([src], { type:'text/javascript' }));
    return this._wurl;
  },

  async start(){
    this.running = true;
    this.el.querySelector('.mine-toggle').textContent = '⏹ Stop mining';
    this.status('Requesting challenge…');
    this.round();
  },

  stop(){
    this.running = false;
    if (this._worker){ this._worker.terminate(); this._worker = null; }
    this.el.querySelector('.mine-toggle').textContent = '⛏ Start mining';
    this.el.querySelector('.mine-rate').textContent = '';
    this.status('Stopped');
  },

  async round(){
    if (!this.running) return;
    var self = this;
    try {
      var w = await this.wallet();
      var cr = await fetch('/api/mine/challenge', { method:'POST',
        headers:{ 'content-type':'application/json' }, body: JSON.stringify({ wallet: w }) });
      if (cr.status === 429){ this.stop(); this.status('Daily cap reached — back tomorrow ⛏', 'ok'); return; }
      if (!cr.ok) throw new Error('HTTP ' + cr.status);
      var ch = await cr.json();
      this.status('Mining at difficulty ' + ch.difficulty_bits + '…');

      if (this._worker) this._worker.terminate();
      this._worker = new Worker(this.workerUrl());
      this._worker.onmessage = async function(e){
        if (e.data.rate) self.el.querySelector('.mine-rate').textContent =
          e.data.rate.toLocaleString() + ' hashes/s · ' + e.data.attempts.toLocaleString() + ' tried';
        if (!e.data.found) return;
        self._worker.terminate(); self._worker = null;
        try {
          var sr = await fetch('/api/mine/submit', { method:'POST',
            headers:{ 'content-type':'application/json' },
            body: JSON.stringify({ wallet: w, challenge: ch.challenge, nonce: e.data.found }) });
          var sd = await sr.json();
          if (!sr.ok) throw new Error(sd.error || ('HTTP ' + sr.status));
          self.el.querySelector('.mine-bal').textContent = sd.balance;
          self.status('+' + sd.reward + ' riff token ✓', 'ok');
          self.nudgeBackup();
          await self.refresh();
          if (window.promoBoss) promoBoss.refresh();
        } catch(err){ self.status('Submit failed: ' + err.message, 'err'); }
        if (self.running) setTimeout(function(){ self.round(); }, 400);
      };
      this._worker.postMessage({ challenge: ch.challenge, bits: ch.difficulty_bits });
    } catch(e){
      this.status('Mining unavailable: ' + e.message, 'err');
      this.stop();
    }
  }
};

/* ── PROMOTE — spend riff tokens to feature a track in the shared catalogue.
   Separate from mining on purpose: earning and spending are different jobs.
   Engagement counters are anonymous aggregates on the promotion itself. ── */
var promoBoss = {
  sel: null,          // { ytId, name, inCatalogue }

  setup(){
    var main =
      "<div class='sec'>" +
        "<div class='sec-head'>Promote a track</div>" +
        "<div class='promo-wallet'><span class='promo-bal'>–</span> tokens · <span class='promo-cost'>–</span> minimum spend</div>" +

          "<input type='text' class='promo-srh' placeholder='Search the catalogue, or paste a YouTube link…'>" +
          "<button class='icon-btn promo-usecur' title='Use the track playing now'>💿</button>" +
        "</div>" +
        "<div class='promo-results'></div>" +
        "<div class='promo-pick'>Nothing selected yet.</div>" +
        "<div class='row promo-spend-row'>" +
          "<span class='promo-spend-lbl'>Spend</span>" +
          "<input type='number' class='promo-tokens' value='5' min='1' step='1'>" +
          "<span class='promo-dur'></span>" +

      "</div>" +
      "<div class='sec promo-sec'>" +
        "<div class='sec-head'>Your promotions</div>" +
        "<div class='promo-list'></div>" +
      "</div>";
    this.el = menuB.createMenu('📣 Promote', main);
    menuB.place(this.el, { right:'1120px', top:'120px', width:'320px' });

    var self = this;
    var srh = this.el.querySelector('.promo-srh');
    srh.addEventListener('input', function(){ clearTimeout(self._t); self._t = setTimeout(function(){ self.search(); }, 200); });
    this.el.querySelector('.promo-usecur').onclick = function(){ self.useCurrent(); };
    this.el.querySelector('.promo-go').onclick = function(){ self.promote(); };
    this.el.querySelector('.promo-tokens').addEventListener('input', function(){ self._touched = true; self.showDuration(); });
    this.el.querySelector('.promo-list').addEventListener('click', function(e){
      var btn = e.target.closest('.promo-act'); if (!btn) return;
      var row = btn.closest('.promo-row');
      if (btn.dataset.a === 'topup'){ row.classList.add('topping'); row.querySelector('.promo-add').focus(); self.showAddDur(row); return; }
      if (btn.dataset.a === 'cancel'){ row.classList.remove('topping'); return; }
      self.action(Number(row.dataset.id), btn.dataset.a, btn, row);
    });
    // live "+Xh" preview beside the token field
    this.el.querySelector('.promo-list').addEventListener('input', function(e){
      var inp = e.target.closest('.promo-add'); if (!inp) return;
      self.showAddDur(inp.closest('.promo-row'));
    });
    this.el.querySelector('.promo-results').addEventListener('click', function(e){
      var row = e.target.closest('.promo-res'); if (!row) return;
      self.select(row.dataset.yt, row.dataset.name, row.dataset.new !== '1');
      self.el.querySelector('.promo-results').innerHTML = '';
      srh.value = '';
    });
    this.refresh();
  },

  status(msg, kind){
    var el = this.el.querySelector('.promo-status');
    el.textContent = msg || '';
    el.className = 'status-bar promo-status' + (kind ? ' ' + kind : '');
    var self = this;
    if (msg && kind === 'ok'){ clearTimeout(this._st); this._st = setTimeout(function(){ if (el.textContent === msg) self.status(''); }, 7000); }
  },

  idFromUrl(u){
    var m = /[?&]v=([A-Za-z0-9_-]{11})/.exec(u)
         || /youtu\.be\/([A-Za-z0-9_-]{11})/.exec(u)
         || /\/(?:shorts|embed)\/([A-Za-z0-9_-]{11})/.exec(u)
         || /^([A-Za-z0-9_-]{11})$/.exec(String(u).trim());
    return m ? m[1] : null;
  },

  select(ytId, name, inCatalogue){
    this.sel = { ytId: ytId, name: name, inCatalogue: inCatalogue !== false };
    this.el.querySelector('.promo-pick').innerHTML =
      "<span class='promo-pick-lbl'>Promoting</span> " + escapeHtml(name) +
      (this.sel.inCatalogue ? '' : " <span class='promo-new'>· will be added to the catalogue</span>");
  },

  useCurrent(){
    if (!player.currentYtId){ this.status('Nothing is playing right now', 'err'); return; }
    var name = player.el.title ? player.el.title.textContent : player.currentYtId;
    this.select(player.currentYtId, name, true);
  },

  // typing a link offers it directly; anything else searches the shared catalogue
  async search(){
    var q = (this.el.querySelector('.promo-srh').value || '').trim();
    var box = this.el.querySelector('.promo-results');
    if (!q){ box.innerHTML = ''; return; }

    var vid = this.idFromUrl(q);
    if (vid){
      var title = 'Video ' + vid;
      try {   // free, keyless title lookup
        var o = await fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + vid) + '&format=json');
        if (o.ok){ var od = await o.json(); if (od.title) title = od.title; }
      } catch(e){}
      box.innerHTML = "<div class='promo-res' data-yt='" + escapeHtml(vid) + "' data-name='" + escapeHtml(title) + "' data-new='1'>"
        + "<span class='name'>" + escapeHtml(title) + "</span><span class='promo-new'>from link</span></div>";
      return;
    }

    try {
      var r = await fetch('/api/search?q=' + encodeURIComponent(q) + '&limit=15&source=db');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var list = await r.json();
      var self = this;
      if (!list.length){ box.innerHTML = "<div class='empty'>Nothing in the catalogue — paste a link instead</div>"; return; }
      box.innerHTML = list.map(function(t){
        var id = self.idFromUrl(t.url || '');
        if (!id) return '';
        return "<div class='promo-res' data-yt='" + escapeHtml(id) + "' data-name='" + escapeHtml(t.name || id) + "'>"
          + "<span class='name'>" + escapeHtml(t.name || id) + "</span></div>";
      }).join('');
    } catch(e){
      box.innerHTML = '';
      this.status('Search unavailable: ' + e.message, 'err');
    }
  },

  showDuration(){
    var n = parseInt(this.el.querySelector('.promo-tokens').value, 10) || 0;
    var cost = this._cost || 5, hrs = this._hours || 24;
    var el = this.el.querySelector('.promo-dur');
    if (n < cost){ el.textContent = 'min ' + cost; el.className = 'promo-dur low'; return; }
    var total = hrs * (n / cost);
    el.className = 'promo-dur';
    el.textContent = total >= 48 ? ('≈ ' + Math.round(total / 24) + ' days') : ('≈ ' + Math.round(total) + 'h');
  },

  async promote(){
    if (!this.sel){ this.status('Pick a track first — search, paste a link, or hit 💿', 'err'); return; }
    var tokens = parseInt(this.el.querySelector('.promo-tokens').value, 10) || 0;
    var btn = this.el.querySelector('.promo-go');
    btn.disabled = true;
    this.status('Promoting…');
    try {
      var w = await riffWallet.get();
      var url = 'https://www.youtube.com/watch?v=' + this.sel.ytId;
      // a track pasted as a link may not be in the catalogue yet — add it first
      // (a plain database write; the YouTube API isn't involved)
      if (!this.sel.inCatalogue){
        await fetch('/api/track', { method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ name: this.sel.name, url: url }) });
      }
      var r = await fetch('/api/promote', { method:'POST', headers:{ 'content-type':'application/json' },
        body: JSON.stringify({ wallet: w, url: url, tokens: tokens }) });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      this.status('Promoted for ' + Math.round(d.hours) + 'h ✓ — ' + d.balance + ' tokens left', 'ok');
      this.sel = null;
      this.el.querySelector('.promo-pick').textContent = 'Nothing selected yet.';
      await this.refresh();
      if (window.mineBoss) mineBoss.refresh();
      if (window.promoTrack) promoTrack.refresh();
      if (window.dataBoss && dataBoss.el && !dataBoss.el.classList.contains('is-hidden')) dataBoss.run();
    } catch(e){
      this.status(e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  },

  showAddDur(row){
    var n = parseInt(row.querySelector('.promo-add').value, 10) || 0;
    var cost = this._cost || 5, hrs = this._hours || 24;
    var el = row.querySelector('.promo-add-dur');
    el.textContent = n > 0 ? ('+' + Math.round(hrs * (n / cost)) + 'h') : '';
  },

  /* pause / resume / top up an existing promotion */
  async action(id, act, btn, row){
    var tokens = 0;
    if (act === 'extend'){
      tokens = parseInt(row.querySelector('.promo-add').value, 10) || 0;
      if (tokens <= 0){ this.status('Enter a positive number of tokens', 'err'); return; }
    }
    btn.disabled = true;
    this.status(act === 'extend' ? 'Adding credits…' : (act === 'pause' ? 'Pausing…' : 'Resuming…'));
    try {
      var w = await riffWallet.get();
      var r = await fetch('/api/promotion/action', { method:'POST', headers:{ 'content-type':'application/json' },
        body: JSON.stringify({ wallet: w, id: id, action: act, tokens: tokens }) });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      this.status(
        act === 'extend' ? ('Added ' + d.added + ' tokens (+' + Math.round(d.added_hours) + 'h) — ' + d.balance + ' left')
        : act === 'pause' ? 'Paused — remaining time is banked'
        : 'Resumed ✓', 'ok');
      await this.refresh();
      if (window.mineBoss) mineBoss.refresh();
      if (window.promoTrack) promoTrack.refresh();
      if (window.dataBoss && dataBoss.el && !dataBoss.el.classList.contains('is-hidden')) dataBoss.run();
    } catch(e){
      this.status(e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  },

  // banked time on a paused promotion
  msLeft(ms){
    ms = Number(ms) || 0;
    if (!(ms > 0)) return 'no time left';
    var h = Math.floor(ms / 3600000);
    if (h >= 48) return Math.round(h / 24) + 'd banked';
    return h >= 1 ? (h + 'h banked') : (Math.max(1, Math.round(ms / 60000)) + 'm banked');
  },

  // "3h left" / "ended" from an ISO timestamp
  timeLeft(iso){
    var ms = new Date(iso).getTime() - Date.now();
    if (!(ms > 0)) return 'ended';
    var h = Math.floor(ms / 3600000);
    if (h >= 48) return Math.round(h / 24) + 'd left';
    return h >= 1 ? (h + 'h left') : (Math.max(1, Math.round(ms / 60000)) + 'm left');
  },

  async refresh(){
    var list = this.el.querySelector('.promo-list');
    try {
      var w = await riffWallet.get();
      try {
        var wr = await fetch('/api/wallet?wallet=' + w);
        if (wr.ok){
          var wd = await wr.json();
          this._cost = wd.promote_cost; this._hours = wd.promote_hours || 24;
          this.el.querySelector('.promo-bal').textContent = wd.balance;
          this.el.querySelector('.promo-cost').textContent = wd.promote_cost;
          var ti = this.el.querySelector('.promo-tokens');
          ti.min = wd.promote_cost; ti.step = wd.promote_cost;
          if (!this._touched){ ti.value = wd.promote_cost; }
          this.showDuration();
        }
      } catch(e0){ /* the balance line is cosmetic */ }

      var r = await fetch('/api/promotions/mine?wallet=' + w);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var rows = await r.json();
      if (!rows.length){
        list.innerHTML = "<div class='empty promo-empty'>Nothing promoted yet.<br>Mine some tokens, then pick a track above.</div>";
        return;
      }
      var self = this;
      list.innerHTML = rows.map(function(p){
        var pid = self.idFromUrl(p.url || '') || '';
        var ended = !p.paused && new Date(p.expires_at).getTime() <= Date.now();
        var state = p.paused ? 'paused' : (ended ? 'ended' : 'live');
        var left = p.paused ? self.msLeft(p.remaining_ms) : (ended ? 'ended' : self.timeLeft(p.expires_at));
        return "<div class='promo-row " + state + "' data-yt='" + escapeHtml(pid) + "' data-id='" + p.id + "'>"
          + "<div class='promo-name'>" + escapeHtml(p.name || p.url) + "</div>"
          + "<div class='promo-stats'>"
            + "<span title='Plays while promoted'>▶ " + (p.plays || 0) + "</span>"
            + "<span title='Likes while promoted'>👍 " + (p.likes || 0) + "</span>"
            + "<span title='Tokens spent'>⛏ " + (p.tokens || 0) + "</span>"
            + "<span class='promo-time' title='Promotion time remaining'>" + left + "</span>"
          + "</div>"
          + "<div class='promo-actions'>"
            + (ended ? "" :
                "<button class='promo-act' data-a='" + (p.paused ? 'resume' : 'pause') + "'>"
                + (p.paused ? '▶ Resume' : '❚❚ Pause') + "</button>")
            + "<button class='promo-act promo-topup' data-a='topup'>＋ Add credits</button>"
          + "</div>"
          + "<div class='promo-topup-row'>"
            + "<input type='number' class='promo-add' min='1' step='1' value='" + (self._cost || 5) + "'>"
            + "<span class='promo-add-dur'></span>"
            + "<button class='promo-act promo-confirm' data-a='extend'>Add</button>"
            + "<button class='promo-act promo-cancel' data-a='cancel'>✕</button>"
          + "</div></div>";
      }).join('');
    } catch(e){
      list.innerHTML = '';
      this.status('Couldn’t load your promotions: ' + e.message, 'err');
    }
  }
};
