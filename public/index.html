  async compute(ytId, trackId){
    const tracks = await db.tracks.toArray();
    const nameByYt = {}, byId = {};
    tracks.forEach(t => { nameByYt[t.ytId] = t.name; byId[t.id] = t; });

    // before / after from play history (consecutive plays)
    const hist = await db.playHistory.orderBy('ts').toArray();
    const before = {}, after = {};
    for (let i = 0; i < hist.length; i++){
      if (hist[i].ytId !== ytId) continue;
      if (i > 0){ const p = hist[i-1].ytId; if (p && p !== ytId) before[p] = (before[p]||0)+1; }
      if (i < hist.length-1){ const n = hist[i+1].ytId; if (n && n !== ytId) after[n] = (after[n]||0)+1; }
    }
    const toList = (m) => Object.keys(m)
      .map(yt => ({ ytId:yt, name: nameByYt[yt] || yt, count:m[yt] }))
      .sort((a,b)=> b.count - a.count);

    // tracks sharing a playlist with this one
    const myJoins = await db.playlistTracks.where('trackId').equals(trackId).toArray();
    const plIds = [...new Set(myJoins.map(j => j.playlistId))];
    const sameIds = new Set();
    for (const pid of plIds){
      const js = await db.playlistTracks.where('playlistId').equals(pid).toArray();
      js.forEach(j => { if (j.trackId !== trackId) sameIds.add(j.trackId); });
    }
    const same = [...sameIds].map(id => byId[id]).filter(Boolean).map(t => ({ ytId:t.ytId, name:t.name }));

    return { before: toList(before), after: toList(after), same };
  }
};


/* ── RIFFROLLED — "Roll the Riff": pull a track into your active playlist. ──
   The pool is CURATED with NO BACKEND: it's your own saved library. The whole
   roll UI/animation is client-side and never needs a server. To go social later
   (a shared, user-contributed pool), replace riffPool.getCandidates() with a
   fetch() to your API that returns the same {ytId,name,artist,tags,rarity} shape —
   nothing else here has to change. */

// each track has an inherent, stable rarity derived from its id (deterministic = collectible feel)
function riffRarity(ytId){
  var h = 0;
  for (var i = 0; i < ytId.length; i++) h = (h * 31 + ytId.charCodeAt(i)) >>> 0;
  var f = (h % 10000) / 10000;
  if (f < 0.55) return 'common';
  if (f < 0.80) return 'rare';
  if (f < 0.94) return 'epic';
  return 'legendary';
}
var RIFF_RARITY_COLOR = { common:'#9aa0b5', rare:'#4aa3ff', epic:'#a06bff', legendary:'#ffb43d' };
var RIFF_LOGO_SVG =
"<svg class='riff-logo' viewBox='0 0 48 48' aria-hidden='true'>" +
  "<defs><linearGradient id='rlg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#8a7bff'/><stop offset='1' stop-color='#46e0ff'/></linearGradient></defs>" +
  "<g class='riff-die d2'>" +
    "<rect x='23' y='5' width='21' height='21' rx='5.5' fill='#15152e' stroke='url(#rlg)' stroke-width='2'/>" +
    "<circle cx='27.2' cy='9.2' r='1.25' fill='url(#rlg)' opacity='0.85'/>" +
    "<circle cx='39.8' cy='21.8' r='1.25' fill='url(#rlg)' opacity='0.85'/>" +
    "<ellipse cx='31.4' cy='19.6' rx='2.9' ry='2.2' fill='url(#rlg)' transform='rotate(-20 31.4 19.6)'/>" +
    "<path d='M34 19.2 L34 10.6 C36.6 11.4 37.6 13 36.8 15.6' fill='none' stroke='url(#rlg)' stroke-width='1.7' stroke-linecap='round'/>" +
  "</g>" +
  "<g class='riff-die d1'>" +
    "<rect x='4.5' y='16.5' width='23' height='23' rx='5.5' fill='#0e0e1c' stroke='url(#rlg)' stroke-width='2'/>" +
    "<circle cx='9.2' cy='21.2' r='1.35' fill='url(#rlg)' opacity='0.85'/>" +
    "<circle cx='22.8' cy='34.8' r='1.35' fill='url(#rlg)' opacity='0.85'/>" +
    "<ellipse cx='13.6' cy='32.6' rx='3.2' ry='2.4' fill='url(#rlg)' transform='rotate(-20 13.6 32.6)'/>" +
    "<path d='M16.5 32.1 L16.5 22.4 C19.4 23.3 20.5 25.1 19.6 28' fill='none' stroke='url(#rlg)' stroke-width='1.8' stroke-linecap='round'/>" +
  "</g>" +
"</svg>";

var riffPool = {
  // CURATED / NO BACKEND — the roll pool is your own library.
  // Backend swap point: return (await fetch('/api/riff-pool')).json();  // same shape, nothing else changes
  async getCandidates(excludeSet){
    var all = await db.tracks.toArray();
    return all
      .filter(t => t.ytId && !(excludeSet && excludeSet.has(t.ytId)))
      .map(t => ({ ytId:t.ytId, name:t.name, artist:t.artist || '', tags:t.tags || '', rarity: riffRarity(t.ytId) }));
  }
};

var riffBoss = {
  setup(){
    var main =
      "<div class='riff-brand'>" + RIFF_LOGO_SVG + "<span class='riff-wordmark'>RIFFROLLED</span></div>" +
      "<div class='riff-body'>" +
        "<div class='riff-opts'>" +
          "<div class='riff-target'>" +
            "<label><input type='radio' name='riffTarget' value='current' checked> Add to current playlist</label>" +
            "<label><input type='radio' name='riffTarget' value='new'> Create a new playlist</label>" +
          "</div>" +
          "<input type='text' class='riff-newname' placeholder='New playlist name…' style='display:none'>" +
          "<div class='riff-row'>" +
            "<label class='riff-field'>Tracks <input type='number' class='riff-count' value='1' min='1' max='25'></label>" +
            "<input type='text' class='riff-tags' placeholder='Filter by tags (optional)…'>" +
          "</div>" +
        "</div>" +
        "<button class='riff-portal' title='Roll tracks into your playlist'><span class='riff-label'>ROLL</span></button>" +
        "<div class='riff-hint'>Each roll drops fresh tracks into the chosen playlist.</div>" +
        "<div class='riff-result'></div>" +
      "</div>";
    this.el = menuB.createMenu('🎲 Roll the Riff', main);
    menuB.place(this.el, { left:'16px', top:'16px', width:'300px' });
    this.el.querySelector('.riff-portal').onclick = () => this.roll();
    // show the name box only when "new playlist" is chosen
    var nameBox = this.el.querySelector('.riff-newname');
    this.el.querySelectorAll("input[name='riffTarget']").forEach(r => {
      r.addEventListener('change', () => {
        var isNew = this.el.querySelector("input[name='riffTarget']:checked").value === 'new';
        nameBox.style.display = isNew ? '' : 'none';
        if (isNew) nameBox.focus();
      });
    });
  },

  async roll(){
    if (this._rolling) return;
    var newMode = this.el.querySelector("input[name='riffTarget']:checked").value === 'new';

    // resolve the target playlist
    var targetId;
    if (newMode){
      var name = (this.el.querySelector('.riff-newname').value || '').trim();
      if (!name) name = 'Riff Roll ' + new Date().toLocaleDateString();
      targetId = await dbBoss.createPl(name);
      await plBoss.setActivePlaylist(targetId);  // make it active so the rolls are visible
    } else {
      if (!window.plBoss || !plBoss.activeId){
        if (window.appNotify) appNotify('Pick an active playlist first, or choose “Create a new playlist”.', 'warn');
        return;
      }
      targetId = plBoss.activeId;
    }

    var n = parseInt(this.el.querySelector('.riff-count').value, 10) || 1;
    n = Math.max(1, Math.min(25, n));

    var tagq = (this.el.querySelector('.riff-tags').value || '').trim().toLowerCase();
    var tagList = tagq ? tagq.split(',').map(s => s.trim()).filter(Boolean) : [];

    // exclude tracks already in the target playlist
    var joins = await db.playlistTracks.where('playlistId').equals(targetId).toArray();
    var owned = new Set();
    var ts = await db.tracks.bulkGet(joins.map(j => j.trackId));
    ts.forEach(t => { if (t) owned.add(t.ytId); });

    var pool = await riffPool.getCandidates(owned);
    if (tagList.length){
      pool = pool.filter(c => { var ct = (c.tags || '').toLowerCase(); return tagList.some(tag => ct.indexOf(tag) !== -1); });
    }
    if (!pool.length){
      if (window.appNotify) appNotify(tagList.length ? 'No new tracks match those tags.' : 'No new tracks to roll — add more to your library, or this playlist already has them all.', 'warn');
      return;
    }

    // pick up to n distinct candidates — gacha-style: roll a rarity tier first
    // (weighted: legendary is genuinely rare), then take a random track of that tier
    var avail = pool.slice(), picks = [], take = Math.min(n, avail.length);
    var TIER_W = { common:60, rare:27, epic:10, legendary:3 };
    function rollOne(list){
      var byTier = {};
      list.forEach(function(c){ (byTier[c.rarity] = byTier[c.rarity] || []).push(c); });
      var tiers = Object.keys(byTier);
      var total = tiers.reduce(function(s,t){ return s + (TIER_W[t] || 1); }, 0);
      var r = Math.random() * total;
      for (var ti = 0; ti < tiers.length; ti++){
        r -= (TIER_W[tiers[ti]] || 1);
        if (r <= 0){
          var arr = byTier[tiers[ti]];
          var c = arr[Math.floor(Math.random() * arr.length)];
          return list.splice(list.indexOf(c), 1)[0];
        }
      }
      return list.splice(Math.floor(Math.random() * list.length), 1)[0];
    }
    for (var i = 0; i < take; i++) picks.push(rollOne(avail));

    var portal = this.el.querySelector('.riff-portal');
    var res = this.el.querySelector('.riff-result');
    var brand = this.el.querySelector('.riff-brand');
    this._rolling = true;
    portal.classList.add('rolling');
    if (brand) brand.classList.add('rolling');
    res.classList.remove('show');

    var self = this;
    setTimeout(async () => {
      portal.classList.remove('rolling');
      if (brand) brand.classList.remove('rolling');
      self._rolling = false;
      for (var k = 0; k < picks.length; k++){
        var p = picks[k];
        var tid = await dbBoss.createTrack(p.ytId, p.name);
        await dbBoss.addToPlaylist(targetId, tid);
      }
      await plBoss.renderTracks(); plBoss.renderPlaylists();
      if (window.searchBoss) searchBoss.render();
      self.renderResult(picks, take < n);
    }, 1100);
  },

  renderResult(picks, short){
    var res = this.el.querySelector('.riff-result');
    var order = { common:0, rare:1, epic:2, legendary:3 };
    var top = picks.reduce((a, b) => order[b.rarity] > order[a.rarity] ? b : a, picks[0]);
    res.style.setProperty('--rar', RIFF_RARITY_COLOR[top.rarity] || RIFF_RARITY_COLOR.common);

    if (picks.length === 1){
      var p = picks[0], meta = [p.artist, p.tags].filter(Boolean).join(' · ');
      res.innerHTML =
        "<div class='riff-rarity'>" + p.rarity + "</div>" +
        "<div class='riff-rname'>" + escapeHtml(p.name) + "</div>" +
        (meta ? "<div class='riff-rmeta'>" + escapeHtml(meta) + "</div>" : '') +
        "<button class='riff-play'>▶ Play now</button>";
      res.querySelector('.riff-play').onclick = () => ytPlay(p.ytId, p.name);
    } else {
      var items = picks.map(p => {
        var c = RIFF_RARITY_COLOR[p.rarity] || RIFF_RARITY_COLOR.common;
        return "<li><span class='riff-dot' style='background:" + c + "'></span><span class='riff-li-name'>" + escapeHtml(p.name) + "</span></li>";
      }).join('');
      res.innerHTML =
        "<div class='riff-rarity'>Added " + picks.length + " track" + (picks.length > 1 ? 's' : '') + "</div>" +
        "<ul class='riff-list'>" + items + "</ul>" +
        (short ? "<div class='riff-rmeta'>(that’s all the pool had left)</div>" : '');
    }
    requestAnimationFrame(() => res.classList.add('show'));
  }
};

/* ── DOCK: right-hand sidebar of on/off panel toggles (desktop only).
   On mobile the panels just stack and scroll, so the dock hides and all show. ── */
var dock = {
  items: [],
  mobile: false,
  _ready: false,   // don't persist until the saved layout has been restored
  _data: null,     // last-known layout map (kept fresh on save)
  _t: null,        // debounce timer
  _placed: null,   // Set of labels the user has dragged (their position is respected)

  build(items){ this.items = items; this.render(); },

  render(){
    const bar = document.querySelector('.rightM');
    if (!bar) return;
    bar.innerHTML = '';

    this.items.forEach(it => {
      if (!it.el) return;
      const btn = document.createElement('button');
      btn.className = 'dock-btn';
      btn.title = it.label;
      if (it.iconSvg) btn.innerHTML = it.iconSvg; else btn.textContent = it.icon;
      btn.setAttribute('aria-label', it.label);
      it.btn = btn;
      if (!it._init){ it._init = true; it.el.classList.toggle('is-hidden', !!it.startHidden); }
      const hidden = it.el.classList.contains('is-hidden');
      btn.classList.toggle('active', !hidden);
      btn.setAttribute('aria-pressed', String(!hidden));
      btn.onclick = () => {
        if (it.el.classList.contains('is-hidden')) this.openPanel(it.el);
        else this.setHidden(it.el, true);
      };
      bar.appendChild(btn);
    });
  },

  // open a panel: show it, keep it within view, and tuck it tidily near the dock
  // unless the user has dragged it themselves (then we honour their position)
  openPanel(el){
    if (!el) return;
    el.classList.remove('is-hidden');
    const it = this.items.find(i => i.el === el);
    if (it && it.btn){ it.btn.classList.add('active'); it.btn.setAttribute('aria-pressed','true'); }
    if (!this.mobile){
      if (this.isPlaced(el)) this.ensureVisible(el);
      else this.autoPlace(el);
      bringToFront(el);
    } else if (el.scrollIntoView){
      el.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
    this.saveLayoutSoon();
  },

  isPlaced(el){
    const it = this.items.find(i => i.el === el);
    return !!(it && this._placed && this._placed.has(it.label));
  },
  markPlaced(el){
    const it = this.items.find(i => i.el === el);
    if (!it) return;
    if (!this._placed) this._placed = new Set();
    if (!this._placed.has(it.label)){
      this._placed.add(it.label);
      if (window.dbBoss) dbBoss.setSetting('placedPanels', JSON.stringify([...this._placed]));
    }
  },

  // tidy auto-position: cascade from just-left-of-the-dock, avoiding other open panels, clamped on-screen
  autoPlace(el){
    if (this.mobile) return;
    const bar = document.querySelector('.rightM');
    const dockLeft = bar ? bar.getBoundingClientRect().left : window.innerWidth;
    const w = el.offsetWidth || 300, h = el.offsetHeight || 260, gap = 14, step = 30;
    const baseLeft = Math.max(8, dockLeft - w - gap);
    const baseTop = window.scrollY + 16;
    const minLeft = Math.max(8, dockLeft - 2 * w - 2 * gap);   // stay within ~2 columns of the dock
    const others = this.items.map(i => i.el).filter(e => e && e !== el && !e.classList.contains('is-hidden'));
    const occupied = (x, y) => others.some(e => {
      const r = e.getBoundingClientRect();
      return Math.abs((r.left + window.scrollX) - x) < step && Math.abs((r.top + window.scrollY) - y) < step;
    });
    let left = baseLeft, top = baseTop, n = 0;
    while (occupied(left, top) && n < 12){
      left -= step; top += step; n++;
      if (left < minLeft || top + h > window.scrollY + window.innerHeight - 8){ left = baseLeft; top = baseTop; break; }
    }
    left = Math.min(Math.max(8, left), dockLeft - w - gap);
    top  = Math.max(window.scrollY + 8, Math.min(top, window.scrollY + window.innerHeight - Math.min(h, window.innerHeight - 40)));
    el.style.left = left + 'px';
    el.style.right = 'auto';
    el.style.top = top + 'px';
  },

  // if a panel would open off-screen (e.g. a stale saved position, or a smaller window),
  // pull it back into view, tucked just left of the dock
  ensureVisible(el){
    if (!el || this.mobile) return;
    const r = el.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight, m = 40;
    const offscreen = r.left > vw - m || r.right < m || r.top > vh - m || r.bottom < m || r.left < 0 || r.top < 0;
    if (!offscreen) return;
    const bar = document.querySelector('.rightM');
    const dockLeft = bar ? bar.getBoundingClientRect().left : vw;
    const w = r.width || 300;
    el.style.left = Math.max(12, dockLeft - w - 16) + 'px';
    el.style.right = 'auto';
    el.style.top = (window.scrollY + 16) + 'px';
    this.saveLayoutSoon();
  },

  ensureAllVisible(){
    if (this.mobile) return;
    this.items.forEach(it => { if (it.el && !it.el.classList.contains('is-hidden')) this.ensureVisible(it.el); });
  },

  setMode(isMobile){
    this.mobile = isMobile;
    this.render();
    if (!isMobile){
      // re-assert positions after a mode switch: saved layout if any, else the near-dock defaults
      if (this._data) this.applyLayout(this._data);
      else if (this._ready) this.applyDefaultLayout();
      this.ensureAllVisible();
    }
  },

  // the designed default: panels anchored near the dock (right-side columns), like a fresh install
  applyDefaultLayout(){
    if (this.mobile) return;
    const pos = {
      'Tracks':           { right:'400px', top:'120px' },
      'Playlists':        { right:'92px',  top:'110px' },
      'Current Playlist': { right:'150px', top:'480px' }
    };
    this.items.forEach(it => {
      const p = pos[it.label];
      if (!p || !it.el) return;
      it.el.style.left = 'auto';
      it.el.style.right = p.right;
      it.el.style.top = p.top;
    });
    this.ensureAllVisible();
  },

  // used by panel ✕ close buttons: hide a panel and keep its dock toggle in sync
  setHidden(el, hidden){
    if (!el) return;
    el.classList.toggle('is-hidden', hidden);
    const it = this.items.find(i => i.el === el);
    if (it && it.btn){ it.btn.classList.toggle('active', !hidden); it.btn.setAttribute('aria-pressed', String(!hidden)); }
    this.saveLayoutSoon();
  },

  // ── layout persistence (per-panel position, size, open/closed → settings table) ──
  snapshot(){
    const data = {};
    this.items.forEach(it => {
      if (!it.el) return;
      const s = it.el.style;
      data[it.label] = {
        left: s.left || '', top: s.top || '', right: s.right || '',
        width: s.width || '', height: s.height || '',
        hidden: it.el.classList.contains('is-hidden')
      };
    });
    return data;
  },

  saveLayout(){
    if (!this._ready || this.mobile) return;   // mobile uses the stacked layout — never overwrite desktop positions
    this._data = this.snapshot();
    if (window.dbBoss) dbBoss.setSetting('panelLayout', JSON.stringify(this._data));
  },

  saveLayoutSoon(){
    if (!this._ready) return;
    clearTimeout(this._t);
    this._t = setTimeout(() => this.saveLayout(), 400);
  },

  applyLayout(data){
    this.items.forEach(it => {
      const d = data[it.label];
      if (!d || !it.el) return;
      const s = it.el.style;
      if (d.left)  { s.left = d.left; s.right = 'auto'; }
      else if (d.right) { s.right = d.right; s.left = 'auto'; }
      if (d.top)    s.top = d.top;
      if (d.width)  s.width = d.width;
      if (d.height) s.height = d.height;
      if (!this.mobile){                         // visibility only matters on desktop; mobile shows all
        it.el.classList.toggle('is-hidden', !!d.hidden);
        if (it.btn) it.btn.classList.toggle('active', !d.hidden);
      }
    });
  },

  // restore saved layout (if any), then start tracking changes
  init(){
    const done = () => {
      this._ready = true;
      if (window.ResizeObserver){
        const ro = new ResizeObserver(() => this.saveLayoutSoon());
        this.items.forEach(it => { if (it.el) ro.observe(it.el); });
      }
    };
    if (!window.dbBoss){ done(); return; }
    Promise.all([ dbBoss.getSetting('panelLayout'), dbBoss.getSetting('placedPanels') ]).then(arr => {
      const raw = arr[0], placedRaw = arr[1];
      try { this._placed = new Set(placedRaw ? JSON.parse(placedRaw) : []); } catch(e){ this._placed = new Set(); }
      if (raw){
        try { this._data = JSON.parse(raw); } catch(e){ this._data = null; }
        if (this._data) this.applyLayout(this._data);
      }
      if (!this._data && !this.mobile) this.applyDefaultLayout();
      this.ensureAllVisible();
      done();
    }).catch(done);
  }
};

// ✕ on any panel header closes it (delegated so it works for every panel)
document.addEventListener('click', function(e){
  const x = e.target.closest && e.target.closest('.panel-close');
  if (!x) return;
  const panel = x.closest('.panel');
  if (panel) dock.setHidden(panel, true);
});

  { icon:'🎵', label:'Tracks',           el: menuB.tracksPanel },

  { icon:'📁', label:'Playlists',        el: plBoss.el },
  { icon:'🎧', label:'Current Playlist', el: plBoss.currentEl },
  { icon:'💿', label:'Current Track',    el: document.getElementById('ctPanel'), startHidden:true },
  { icon:'🔗', label:'Links',            el: linksBoss.el, startHidden:true },
  { icon:'ℹ️', label:'About & Legal',    el: infoBoss.el, startHidden:true }
]);

/* desktop vs mobile based on screen width */
(function(){
  const mq = window.matchMedia('(max-width: 760px)');
  const apply = () => { document.body.classList.toggle('mobile', mq.matches); dock.setMode(mq.matches); };
  if (mq.addEventListener) mq.addEventListener('change', apply);
  else if (mq.addListener) mq.addListener(apply); // older Safari
  apply();
})();

// load any saved layout (positions / sizes / which panels are open), then track changes
dock.init();

<script>
/* ================================================================= */
/* ==  SELF-TESTS (browser) — load the page with #test to run     == */
/* ==  Runs the real dbBoss against a throwaway DB, then restores. == */
/* ================================================================= */
async function runSelfTests(){
  const assert = (c, m) => { if (!c) throw new Error(m || 'assertion failed'); };

  const tests = [
    ['createTrack dedupes by ytId', async () => {
      const a = await dbBoss.createTrack('aaaaaaaaaaa', 'A');
      const b = await dbBoss.createTrack('aaaaaaaaaaa', 'A again');
      assert(a === b, 'same ytId returns same id');
      assert((await db.tracks.count()) === 1, 'one track row');
    }],
    ['addToPlaylist dedupes + sequential order', async () => {
      const pl = await dbBoss.createPl('P');
      const t1 = await dbBoss.createTrack('t1111111111', 'T1');
      const t2 = await dbBoss.createTrack('t2222222222', 'T2');
      assert((await dbBoss.addToPlaylist(pl, t1)) === 'added');
      assert((await dbBoss.addToPlaylist(pl, t1)) === 'dupe', 'duplicate rejected');
      assert((await dbBoss.addToPlaylist(pl, t2)) === 'added');
      const j = await db.playlistTracks.where('playlistId').equals(pl).sortBy('order');
      assert(j.length === 2 && j[0].order === 0 && j[1].order === 1, 'orders 0,1');
    }],
    ['linkTracks undirected/deduped/self-reject; unlink', async () => {
      const x = await dbBoss.createTrack('x1111111111', 'X');
      const y = await dbBoss.createTrack('y1111111111', 'Y');
      assert((await dbBoss.linkTracks(x, y)) === 'added');
      assert((await dbBoss.linkTracks(y, x)) === 'dupe', 'reverse is dup');
      assert((await dbBoss.linkTracks(x, x)) === 'invalid', 'self invalid');
      assert((await dbBoss.getLinkedTrackIds(x)).includes(y) && (await dbBoss.getLinkedTrackIds(y)).includes(x), 'bidirectional');
      await dbBoss.unlinkTracks(x, y);
      assert((await dbBoss.getLinkedTrackIds(x)).length === 0, 'unlinked');
    }],
    ['logPlay records history', async () => {
      const t = await dbBoss.createTrack('zzzzzzzzzzz', 'Z');
      await dbBoss.logPlay('zzzzzzzzzzz');
      const h = await db.playHistory.toArray();
      assert(h.length === 1 && h[0].ytId === 'zzzzzzzzzzz' && h[0].trackId === t, 'history row');
    }],
    ['export -> import round-trips + idempotent', async () => {
      const p = await dbBoss.createPl('Mix');
      const ta = await dbBoss.createTrack('aaaaaaaaaaa', 'Song A');
      const tb = await dbBoss.createTrack('bbbbbbbbbbb', 'Song B');
      await dbBoss.addToPlaylist(p, ta); await dbBoss.addToPlaylist(p, tb);
      await dbBoss.linkTracks(ta, tb);
      const dump = await dbBoss.exportData();
      await Promise.all([db.tracks, db.playlists, db.playlistTracks, db.trackLinks, db.playHistory].map(t => t.clear()));
      const r1 = await dbBoss.importData(dump);
      assert(r1.addedPlaylists === 1 && r1.addedTracks === 2 && r1.addedJoins === 2 && r1.addedLinks === 1, 'import counts');
      const r2 = await dbBoss.importData(dump);
      assert(r2.addedPlaylists === 0 && r2.addedTracks === 0 && r2.addedJoins === 0 && r2.addedLinks === 0, 're-import adds nothing');
      const plId = (await db.playlists.toArray())[0].id;
      const j = await db.playlistTracks.where('playlistId').equals(plId).sortBy('order');
      const names = (await db.tracks.bulkGet(j.map(x => x.trackId))).map(t => t.name);
      assert(names[0] === 'Song A' && names[1] === 'Song B', 'order preserved');
    }],
    ['import merges same-named playlist (no duplicate)', async () => {
      const p = await dbBoss.createPl('Keep');
      await dbBoss.addToPlaylist(p, await dbBoss.createTrack('old11111111', 'Old'));
      const r = await dbBoss.importData({ playlists: [ { name: 'Keep', tracks: [ { ytId: 'new11111111', name: 'New' } ] } ] });
      assert((await db.playlists.count()) === 1 && r.addedPlaylists === 0, 'no dup playlist');
      assert((await db.playlistTracks.where('playlistId').equals(p).count()) === 2, 'merged in');
    }],
    ['riff rarity is deterministic and valid', async () => {
      const a = riffRarity('dQw4w9WgXcQ'), b = riffRarity('dQw4w9WgXcQ');
      assert(a === b, 'same id -> same rarity');
      assert(['common','rare','epic','legendary'].includes(a), 'valid tier');
    }]
  ];

  // run against a throwaway DB so real data is never touched
  const realDb = db;
  const testDb = new Dexie('vinyl_selftest_' + Date.now());
  testDb.version(7).stores({
    playlists: '++id, name, createdAt, plays, tags',
    tracks: '++id, ytId, name, artist, tags, plays',
    playlistTracks: '++id, playlistId, trackId, addedAt, order',
    playHistory: '++id, trackId, ytId, ts',
    trackLinks: '++id, a, b, createdAt',
    settings: 'k',
    reactions: '++id, ytId, trackId, kind, ts'
  });
  await testDb.open();

  const results = [];
  let pass = 0, fail = 0;
  db = testDb;                       // dbBoss now operates on the throwaway DB
  try {
    for (const [name, fn] of tests){
      await Promise.all([db.tracks, db.playlists, db.playlistTracks, db.trackLinks, db.playHistory, db.reactions].map(t => t.clear()));
      try { await fn(); results.push({ ok:true, name }); pass++; }
      catch (e){ results.push({ ok:false, name, msg:e.message }); fail++; }
    }
  } finally {
    db = realDb;                     // restore the real DB
    await testDb.delete();
  }

  results.forEach(r => console.log((r.ok ? 'ok   ' : 'FAIL ') + r.name + (r.msg ? '  ::  ' + r.msg : '')));
  console.log(pass + ' passed, ' + fail + ' failed');

  // visible overlay
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:auto 16px 16px auto;z-index:3000;max-width:420px;background:#15151f;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 14px;font:13px/1.5 monospace;color:#e0e0e0;box-shadow:0 8px 32px rgba(0,0,0,.6);';
  box.innerHTML = '<b>Self-tests — ' + pass + ' passed, ' + fail + ' failed</b>' +
    results.map(r => '<div style="color:' + (r.ok ? '#5ab88a' : '#d46060') + '">' +
      (r.ok ? '✓' : '✗') + ' ' + r.name + (r.msg ? ' — ' + r.msg : '') + '</div>').join('') +
    '<div style="margin-top:8px;color:rgba(255,255,255,.4)">reload without #test for normal use</div>';
  document.body.appendChild(box);
}

if (location.hash.indexOf('test') !== -1 || location.search.indexOf('selftest') !== -1){
  window.addEventListener('load', runSelfTests);
}
</script>
