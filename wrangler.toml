# ── riffrolled — one Worker serves everything ─────────────────────────
# Static frontend (public/) + JSON API (/api/*) + D1, all on Cloudflare.
# Deployed via Cloudflare's Git integration — no local tooling required.
name = "riffrolled"
main = "src/index.js"
compatibility_date = "2026-06-01"

# The frontend. Requests that match a file in ./public are served as
# static assets; everything else (i.e. /api/*) falls through to the Worker.
[assets]
directory = "./public"

# D1 binding. Create the database in the Cloudflare dashboard
# (Storage & Databases → D1 → Create), then paste its ID below.
[[d1_databases]]
binding = "DB"
database_name = "riffrolled"
database_id = "fc38c5e0-2d5f-4dbf-9c2b-44b69ef7280c"

# ── housekeeping on a clock ────────────────────────────────────────────
# Hourly. The scheduled() handler in src/index.js deletes campaigns that
# spent their last credit more than PROMO_SWEEP_HOURS ago, and prunes
# uncopied brief offers and old mint-rate buckets.
#
# Cron Triggers are included on the Workers free plan. Hourly is far more
# often than the work needs — the grace period is a day — but a cheap
# pass that runs often degrades gracefully if one firing is missed, where
# a single daily pass does not.
#
# Nothing breaks without this. Every sweep target is housekeeping: the
# site stays correct, the tables just keep rows they no longer need.
[triggers]
crons = ["17 * * * *"]

[vars]
# Frontend and API share one origin now, so CORS is same-origin by default.
# This only matters if you later call the API from another site.
ALLOWED_ORIGIN = "https://riffrolled.com"

# ── riff token tunables (defaults shown; uncomment to change) ──
# These are the middle of three layers: the `config` table in D1 wins over
# anything set here, and these win over the defaults in src/config.js. A
# key that is not in src/config.js SCHEMA is ignored entirely, so a stale
# var here is dead weight rather than a hidden setting.
#
# MINE_DAILY_CAP used to be here. It is gone, not renamed. A per-wallet cap
# limited nobody: a wallet is 64 random hex characters, so anyone holding
# fifty wallets had fifty times the cap, and the only person it bound was
# the honest one with a single wallet. Difficulty is the brake now, and it
# moves with how fast the whole site is minting. See src/routes/mine.js.
#
# MINE_DIFFICULTY_BITS = "20"   # base leading zero bits (each +1 doubles mining time)
# MINE_REWARD = "1"             # tokens per solved challenge
# MINE_TARGET_PER_HOUR = "60"   # site-wide credits/hour difficulty aims at; 0 = off
# MINE_RETARGET_WINDOW_H = "6"  # hours of mint history the rate is measured over
# MINE_DIFFICULTY_FLOOR = "16"  # bounds how far a tier discount can take it down
# MINE_DIFFICULTY_CEIL = "24"   # so a phone is never priced out entirely
# MINE_TIER1_UNTIL = "1000"     # wallets up to here get TIER1_DISCOUNT fewer bits
# MINE_TIER1_DISCOUNT = "2"     # 2 bits = four times less work per credit
# MINE_TIER2_UNTIL = "10000"
# MINE_TIER2_DISCOUNT = "1"
# PROMOTE_COST = "5"            # tokens to promote a track
# PROMOTE_HOURS = "24"          # how long a promotion stays live

# ── link verification (defaults shown) ──
# Anyone can POST to /api/track and /api/playlist/save, so before a link joins
# the shared catalogue the Worker asks YouTube's keyless oEmbed endpoint
# whether the video exists. No API key, no YouTube quota, cached at the edge.
# A Worker on the free plan gets 50 external subrequests per invocation, so
# the per-request cap sits well under that; tracks beyond it are stored
# unverified and stay out of the public catalogue until something confirms
# them. Set VERIFY_LINKS = "0" to switch the whole thing off.
# VERIFY_LINKS = "1"
# VERIFY_MAX_CHECKS = "24"      # live oEmbed checks per request

# ── AI DJ resolution (defaults shown) ──
# Resolving an AI playlist tries free paths first (a link the browser
# validated via YouTube's keyless oEmbed endpoint, then our own catalogue).
# Only what's left falls back to YouTube search.list at 100 quota units a
# call, inside these caps. Set AI_YT_DAILY = "0" to switch that off.
# AI_YT_DAILY = "40"            # search.list calls a day, whole site
# AI_YT_PER_REQUEST = "8"       # ...and at most this many per playlist

# Secrets (set in dashboard → your Worker → Settings → Variables & Secrets):
#   YT_API_KEY = your YouTube Data API v3 key
