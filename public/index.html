<!-- ==  STYLES  (was: index.html inline <!-- Styles. Load order matters: base → shared panel chrome → features → mobile. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/deck.css">
<link rel="stylesheet" href="css/dock.css">
<link rel="stylesheet" href="css/features.css">

<body>
<div id="appBanner" class="app-banner" hidden></div>

<!-- ================================================================= -->
<!-- ==  MARKUP  (was: index.html <body>)  — deck untouched         == -->
<!-- ================================================================= -->
<div class='flex flex1'>
    <div class="deck" id="deck">
        <div class="plinth">
            <div class="turntable">
              <div class="platter" id="platter"></div>
            </div>

            <!-- 200x200 video player kept upright + unobscured per YouTube API rules -->
            <div class="screen">
              <div id="ytFrame"></div>
              <div class="screen-ph" id="screenPh" aria-hidden="true">
                <svg viewBox="0 0 90 64" width="78" height="55"><rect width="90" height="64" rx="14" fill="#ff0000"/><path d="M36 19 L36 45 L60 32 Z" fill="#fff"/></svg>
              </div>
            </div>

            <div class="arm" id="arm">
            <div class="arm-pivot"></div>
            <div class="arm-rod"></div>
            <div class="arm-head"></div>
            </div>

            <div class="deck-hint" id="deckHint" hidden>
                <div class="dh-title">Nothing on the deck yet</div>
                <div class="dh-sub">Paste a YouTube link or import a channel to spin your first record.</div>
                <button class="dh-go">▶ Add some music</button>
            </div>

            <div class="np-area">
                <div class="np-title" id="npTitle"><svg class="np-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l10-2v3L11 6.5V17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="7" cy="17.5" r="2.6" fill="currentColor"/><circle cx="17" cy="15.5" r="2.6" fill="currentColor"/></svg><span class="np-text">No track loaded</span></div>

                <div class="transport">
                    <button class="t-btn" id="btnPrev">⏮</button>
                    <button class="t-btn play" id="btnPlay">▶</button>
                    <button class="t-btn" id="btnNext">⏭</button>
                </div>

                <div class="np-react deck-react">
                    <button class="react-btn react-like" title="Like this track">👍 <span class="count like-count">0</span></button>
                    <button class="react-btn react-dislike" title="Dislike this track">👎 <span class="count dislike-count">0</span></button>
                </div>

                <label class="spin-toggle">
                    <input type="checkbox" id="spinToggle" checked>
                    <span class="spin-track"><span class="spin-thumb"></span></span>
                    <span class="spin-label">Spin</span>
                </label>
                <label class="spin-toggle" id="wakeToggleWrap" title="Keep the screen on while music plays (uses more battery). Phones pause YouTube when the screen turns off.">
                    <input type="checkbox" id="wakeToggle">
                    <span class="spin-track"><span class="spin-thumb"></span></span>
                    <span class="spin-label">Awake</span>
                </label>
            </div>
        </div>
    </div>
    <div class='marLAuto w3em rightM flex column'></div>
</div>

<!-- burnt-in brand: decorative, sits beneath the panels, top-right by the dock -->
<div class="brand-burn" aria-hidden="true">
  <svg viewBox="0 0 48 48"><g transform="rotate(14 33.5 15.5)"><rect x="23" y="5" width="21" height="21" rx="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="27.2" cy="9.2" r="1.25" fill="currentColor"/><circle cx="39.8" cy="21.8" r="1.25" fill="currentColor"/><ellipse cx="31.4" cy="19.6" rx="2.9" ry="2.2" fill="currentColor" transform="rotate(-20 31.4 19.6)"/><path d="M34 19.2 L34 10.6 C36.6 11.4 37.6 13 36.8 15.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></g><g transform="rotate(-8 16 28)"><rect x="4.5" y="16.5" width="23" height="23" rx="5.5" fill="#11111f" stroke="currentColor" stroke-width="2.2"/><circle cx="9.2" cy="21.2" r="1.35" fill="currentColor"/><circle cx="22.8" cy="34.8" r="1.35" fill="currentColor"/><ellipse cx="13.6" cy="32.6" rx="3.2" ry="2.4" fill="currentColor" transform="rotate(-20 13.6 32.6)"/><path d="M16.5 32.1 L16.5 22.4 C19.4 23.3 20.5 25.1 19.6 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g></svg>
  <span class="bb-word"><em class="bb-riff">riff</em><em class="bb-rolled">rolled</em><em class="bb-tld">.com</em></span>
</div>

<!-- Current Track panel: a dockable menu like Tracks/Playlists. Kept in the DOM from load
     so the player's existing meta wiring (#npTitle, .np-artist, .react-like, …) keeps working. -->
<div class='cont flex column panel' id="ctPanel">
    <div class='flex alignMe title panel-header fs1em'>💿 Current Track<button class='panel-close' title='Close' aria-label='Close'>✕</button></div>
    <div class='mainC flex1'>
        <div class="ct-body">
            <label class="ct-titlebar">
                <span class="ct-tlabel">Title</span>
                <input type="text" class="ct-title ct-title-edit" placeholder="No track loaded">
            </label>
            <div class="np-meta">
                <input type="text" class="np-artist" placeholder="Artist…">
                <input type="text" class="np-tags" placeholder="Tags (comma separated)…">
            </div>
            <div class="np-react">
                <button class="react-btn react-like" title="Like (tap to add)">👍 <span class="count like-count">0</span></button>
                <button class="react-btn react-dislike" title="Dislike (tap to add)">👎 <span class="count dislike-count">0</span></button>
            </div>
            <label class="ct-autopop"><input type="checkbox" class="ct-autopop-cb" checked> Pop up when the track changes</label>
        </div>
    </div>
</div>
